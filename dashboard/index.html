// --- Pestering Page ---
function renderPesteringPage() {
  const entries = state.pestering || [];
  const stages = state.pesteringStages || {};
  const filter = state.pesteringFilter;

  const pending = entries.filter(e => e.status === 'pending');
  const sent = entries.filter(e => e.status === 'sent');
  const skipped = entries.filter(e => e.status === 'skipped');
  const due = pending.filter(e => new Date(e.scheduled_for) <= new Date());

  let filtered = [...entries];
  if (filter === 'due') filtered = due;
  else if (filter === 'pending') filtered = pending;
  else if (filter === 'sent') filtered = sent;
  else if (filter === 'skipped') filtered = skipped;

  filtered.sort((a, b) => new Date(a.scheduled_for) - new Date(b.scheduled_for));

  const channelColor = (ch) => {
    const map = { phone: 'var(--green)', email: 'var(--blue)', whatsapp: '#25D366', linkedin: '#0A66C2', telegram_alert: 'var(--purple)' };
    return map[ch] || 'var(--gray-500)';
  };

  return h('div', { className: 'page-content' },
    // Stats
    h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '16px', marginBottom: '20px' } },
      h('div', { className: 'card', style: { textAlign: 'center', padding: '16px', cursor: 'pointer', background: filter === 'due' ? 'var(--red-light)' : '' },
        onclick: () => { state.pesteringFilter = filter === 'due' ? 'all' : 'due'; render(); }
      },
        h('div', { style: { fontSize: '24px', fontWeight: '700', color: 'var(--red)', fontFamily: "'Fraunces', serif" } }, String(due.length)),
        h('div', { style: { fontSize: '12px', color: 'var(--gray-500)', marginTop: '4px' } }, 'Due Now')
      ),
      h('div', { className: 'card', style: { textAlign: 'center', padding: '16px', cursor: 'pointer', background: filter === 'pending' ? 'var(--amber-light)' : '' },
        onclick: () => { state.pesteringFilter = filter === 'pending' ? 'all' : 'pending'; render(); }
      },
        h('div', { style: { fontSize: '24px', fontWeight: '700', color: 'var(--amber)', fontFamily: "'Fraunces', serif" } }, String(pending.length)),
        h('div', { style: { fontSize: '12px', color: 'var(--gray-500)', marginTop: '4px' } }, 'Pending')
      ),
      meetingStatCard('Sent', sent.length),
      meetingStatCard('Skipped', skipped.length)
    ),
    // Stage reference
    h('div', { className: 'card', style: { padding: '14px 18px', marginBottom: '20px' } },
      h('div', { style: { fontSize: '12px', fontWeight: '600', color: 'var(--gray-500)', marginBottom: '8px', textTransform: 'uppercase', letterSpacing: '0.5px' } }, 'Follow-up stages'),
      h('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap' } },
        ...Object.keys(stages).map(s =>
          h('span', { style: {
            padding: '4px 10px', borderRadius: '12px', fontSize: '12px', fontWeight: '500',
            background: 'var(--gray-100)', color: 'var(--gray-600)'
          } }, s.replace(/_/g, ' '))
        )
      )
    ),
    // Entries list
    filtered.length === 0
      ? h('div', { className: 'card', style: { textAlign: 'center', padding: '40px', color: 'var(--gray-400)' } },
          h('div', { innerHTML: icons.pestering, style: { width: '48px', height: '48px', margin: '0 auto 12px', opacity: '0.3' } }),
          h('p', {}, 'No follow-up entries'),
          h('p', { style: { fontSize: '13px', marginTop: '8px' } }, 'Create pestering schedules from client profiles')
        )
      : h('div', { style: { display: 'flex', flexDirection: 'column', gap: '6px' } },
          ...filtered.map(e => {
            const isDue = e.status === 'pending' && new Date(e.scheduled_for) <= new Date();
            const isPast = e.status !== 'pending';
            return h('div', {
              className: 'card',
              style: { padding: '10px 16px', display: 'flex', alignItems: 'center', gap: '12px',
                opacity: isPast ? '0.6' : '1',
                borderLeft: isDue ? '3px solid var(--red)' : 'none' }
            },
              // Channel badge
              h('span', { style: {
                background: channelColor(e.channel) + '18', color: channelColor(e.channel),
                padding: '3px 10px', borderRadius: '12px', fontSize: '11px', fontWeight: '600',
                minWidth: '80px', textAlign: 'center'
              } }, e.channel),
              // Content
              h('div', { style: { flex: 1, minWidth: 0 } },
                h('div', { style: { fontSize: '13px', fontWeight: '500' } },
                  h('span', {}, e.client_name || '?'),
                  h('span', { style: { color: 'var(--gray-400)', marginLeft: '8px' } }, e.message_type?.replace(/_/g, ' '))
                ),
                e.content ? h('div', { style: { fontSize: '12px', color: 'var(--gray-500)', marginTop: '2px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: '400px' } }, e.content) : null,
                h('div', { style: { fontSize: '11px', color: 'var(--gray-400)', marginTop: '2px' } },
                  `${e.stage} — ${new Date(e.scheduled_for).toLocaleDateString()} ${new Date(e.scheduled_for).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`)
              ),
              // Status badge
              h('span', { style: {
                padding: '3px 8px', borderRadius: '12px', fontSize: '11px', fontWeight: '600',
                background: e.status === 'sent' ? 'var(--green-light)' : e.status === 'skipped' ? 'var(--gray-100)' : isDue ? 'var(--red-light)' : 'var(--amber-light)',
                color: e.status === 'sent' ? 'var(--green)' : e.status === 'skipped' ? 'var(--gray-500)' : isDue ? 'var(--red)' : 'var(--amber)'
              } }, e.status),
              // Actions for pending entries
              e.status === 'pending' ? h('div', { style: { display: 'flex', gap: '4px' } },
                // Generate message
                h('button', {
                  className: 'btn btn-ghost btn-sm',
                  style: { fontSize: '11px', padding: '2px 8px' },
                  disabled: state.generatingPesterMsg === e.id,
                  onclick: async (ev) => {
                    ev.stopPropagation();
                    state.generatingPesterMsg = e.id; render();
                    try {
                      const msg = await api(`/api/pestering/${e.id}/generate`, { method: 'POST' });
                      toast('Message generated', 'success');
                      await loadData();
                    } catch (err) { toast('Failed: ' + err.message, 'error'); }
                    state.generatingPesterMsg = null; render();
                  }
                }, state.generatingPesterMsg === e.id ? '...' : 'Draft'),
                // Mark sent
                h('button', {
                  className: 'btn btn-ghost btn-sm',
                  style: { fontSize: '11px', padding: '2px 8px', color: 'var(--green)' },
                  onclick: async (ev) => {
                    ev.stopPropagation();
                    try {
                      await api(`/api/pestering/${e.id}`, { method: 'PUT', body: { status: 'sent' } });
                      toast('Marked sent', 'success');
                      await loadData();
                    } catch (err) { toast('Failed: ' + err.message, 'error'); }
                  }
                }, 'Sent'),
                // Skip
                h('button', {
                  className: 'btn btn-ghost btn-sm',
                  style: { fontSize: '11px', padding: '2px 8px', color: 'var(--gray-400)' },
                  onclick: async (ev) => {
                    ev.stopPropagation();
                    try {
                      await api(`/api/pestering/${e.id}`, { method: 'PUT', body: { status: 'skipped' } });
                      toast('Skipped', 'info');
                      await loadData();
                    } catch (err) { toast('Failed: ' + err.message, 'error'); }
                  }
                }, 'Skip')
              ) : null
            );
          })
        )
  );
}

// --- Insights Page ---
function renderInsightsPage() {
  const insights = state.insights || [];
  const filter = state.insightsFilter;
  const categories = [...new Set(insights.map(i => i.category).filter(Boolean))];

  let filtered = [...insights];
  if (filter) filtered = filtered.filter(i => i.category === filter);

  const byCategory = {};
  for (const i of insights) { (byCategory[i.category || 'general'] = byCategory[i.category || 'general'] || []).push(i); }

  const catColor = (cat) => {
    const map = { objection: 'var(--red)', pricing: 'var(--amber)', technique: 'var(--green)', pain_point: 'var(--blue)', process_gap: 'var(--purple)' };
    return map[cat] || 'var(--gray-500)';
  };

  return h('div', { className: 'page-content' },
    // Stats
    h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(120px, 1fr))', gap: '16px', marginBottom: '20px' } },
      meetingStatCard('Total', insights.length),
      ...categories.map(cat =>
        h('div', { className: 'card', style: { textAlign: 'center', padding: '16px', cursor: 'pointer', background: filter === cat ? catColor(cat) + '12' : '' },
          onclick: () => { state.insightsFilter = filter === cat ? '' : cat; render(); }
        },
          h('div', { style: { fontSize: '24px', fontWeight: '700', color: catColor(cat), fontFamily: "'Fraunces', serif" } }, String(byCategory[cat]?.length || 0)),
          h('div', { style: { fontSize: '12px', color: 'var(--gray-500)', marginTop: '4px' } }, cat.replace(/_/g, ' '))
        )
      )
    ),
    // Playbook button
    h('div', { style: { marginBottom: '20px' } },
      h('button', {
        className: 'btn btn-primary btn-sm',
        disabled: state.generatingPlaybook,
        onclick: async () => {
          state.generatingPlaybook = true; render();
          try {
            const result = await api('/api/insights/playbook', { method: 'POST' });
            state.playbook = result;
            toast('Playbook generated', 'success');
          } catch (err) { toast('Failed: ' + err.message, 'error'); }
          state.generatingPlaybook = false; render();
        }
      }, state.generatingPlaybook ? 'Generating...' : 'Generate Objection Playbook')
    ),
    // Playbook display
    state.playbook ? h('div', { className: 'card', style: { padding: '18px', marginBottom: '20px' } },
      h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px' } },
        h('h4', { style: { fontFamily: "'Fraunces', serif" } }, 'Objection Playbook'),
        h('button', { className: 'btn btn-ghost btn-sm', onclick: () => { state.playbook = null; render(); } }, 'Close')
      ),
      ...(state.playbook.playbook || []).map(entry =>
        h('div', { style: { marginBottom: '16px', padding: '12px', background: 'var(--gray-50)', borderRadius: 'var(--radius-sm)' } },
          h('div', { style: { fontWeight: '600', fontSize: '14px', color: 'var(--red)', marginBottom: '4px' } }, entry.objection),
          h('div', { style: { fontSize: '13px', marginBottom: '4px' } },
            h('span', { style: { fontWeight: '500' } }, 'Response: '),
            entry.response
          ),
          entry.example ? h('div', { style: { fontSize: '12px', color: 'var(--gray-500)', fontStyle: 'italic' } }, `"${entry.example}"`) : null
        )
      )
    ) : null,
    // Insights list
    filtered.length === 0
      ? h('div', { className: 'card', style: { textAlign: 'center', padding: '40px', color: 'var(--gray-400)' } },
          h('div', { innerHTML: icons.insights, style: { width: '48px', height: '48px', margin: '0 auto 12px', opacity: '0.3' } }),
          h('p', {}, 'No insights yet'),
          h('p', { style: { fontSize: '13px', marginTop: '8px' } }, 'Insights are extracted from meeting transcripts automatically')
        )
      : h('div', { style: { display: 'flex', flexDirection: 'column', gap: '6px' } },
          ...filtered.map(i =>
            h('div', { className: 'card', style: { padding: '12px 16px', display: 'flex', alignItems: 'center', gap: '12px' } },
              h('span', { style: {
                background: catColor(i.category) + '18', color: catColor(i.category),
                padding: '3px 10px', borderRadius: '12px', fontSize: '11px', fontWeight: '600',
                minWidth: '80px', textAlign: 'center', whiteSpace: 'nowrap'
              } }, (i.category || 'general').replace(/_/g, ' ')),
              h('div', { style: { flex: 1, minWidth: 0 } },
                h('div', { style: { fontSize: '13px' } }, i.insight),
                h('div', { style: { fontSize: '11px', color: 'var(--gray-400)', marginTop: '2px', display: 'flex', gap: '12px' } },
                  h('span', {}, `Seen ${i.frequency || 1}x`),
                  i.last_seen ? h('span', {}, `Last: ${new Date(i.last_seen).toLocaleDateString()}`) : null,
                  i.status !== 'active' ? h('span', { style: { color: i.status === 'confirmed' ? 'var(--green)' : 'var(--red)' } }, i.status) : null

              // Confirm / Reject buttons
              i.status === 'active' ? h('div', { style: { display: 'flex', gap: '4px' } },

                  className: 'btn btn-ghost btn-sm',

                      await api(`/api/insights/${i.id}`, { method: 'PUT', body: { status: 'confirmed' } });

                      await loadData();
                    } catch (err) { toast('Failed', 'error'); }
                  }
                }, 'Reject')
              ) : null
            )
          )
        )
  );
}

// --- Deals Page ---
function renderDealsPage() {
  const deals = state.deals || [];
  const won = deals.filter(d => d.outcome === 'won');
  const lost = deals.filter(d => d.outcome === 'lost');
  const totalMRR = won.reduce((s, d) => s + (d.monthly_value || 0), 0);

  const lossReasons = {};
  for (const d of lost) { const r = d.loss_reason || 'Unknown'; lossReasons[r] = (lossReasons[r] || 0) + 1; }

  return h('div', { className: 'page-content' },
    // Stats
    h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '16px', marginBottom: '20px' } },

      : h('div', { style: { display: 'flex', flexDirection: 'column', gap: '6px' } },
          ...deals.map(d =>
            h('div', { className: 'card', style: { padding: '12px 16px', display: 'flex', alignItems: 'center', gap: '12px' } },
              h('span', { style: {
                width: '10px', height: '10px', borderRadius: '50%', flexShrink: 0,
                background: d.outcome === 'won' ? 'var(--green)' : 'var(--red)'
              } }),
              h('div', { style: { flex: 1, minWidth: 0 } },
                h('div', { style: { fontSize: '14px', fontWeight: '500' } }, d.client_name || 'Unknown'),
                h('div', { style: { fontSize: '12px', color: 'var(--gray-500)', marginTop: '2px' } },
                  d.loss_reason ? `Lost: ${d.loss_reason}` : d.notes || ''
                )
              ),
              d.monthly_value ? h('span', { style: {
                fontWeight: '600', fontSize: '14px',
                color: d.outcome === 'won' ? 'var(--green)' : 'var(--gray-500)'
              } }, `$${d.monthly_value.toLocaleString()}/mo`) : null,
              h('span', { style: {
                padding: '3px 10px', borderRadius: '12px', fontSize: '11px', fontWeight: '600',
                background: d.outcome === 'won' ? 'var(--green-light)' : 'var(--red-light)',
                color: d.outcome === 'won' ? 'var(--green)' : 'var(--red)'
              } }, d.outcome),
              d.created_at ? h('span', { style: { fontSize: '11px', color: 'var(--gray-400)' } }, new Date(d.created_at).toLocaleDateString()) : null
            )
          )
        )
  );
}

function renderSaveUrlPage() {
  const urlTriggers = state.triggers.filter(t => t.source === 'url');
  const allFormats = [
    { key: 'linkedin', label: 'LinkedIn Post' },
    { key: 'x_single', label: 'Tweet' },
    { key: 'x_thread', label: 'Thread (5-7 tweets)' },
    { key: 'short_video', label: 'Video Script' },
    { key: 'blog', label: 'Blog Post (long-form)' },
    { key: 'youtube_script', label: 'YouTube Script (long-form)' }
  ];

  return h('div', { className: 'page-content' },
    h('div', { className: 'card', style: { padding: '32px', maxWidth: '700px' } },
      h('h3', { style: { fontSize: '20px', color: 'var(--navy)', marginBottom: '8px' } }, 'Recreate from URL'),
      h('p', { style: { color: 'var(--gray-500)', marginBottom: '20px', fontSize: '14px' } },
        'Paste any link — article, social post, competitor blog, YouTube video — choose which formats to create, and the system will recreate it in your brand voice.'
      ),
      // URL input
      h('div', { style: { marginBottom: '20px' } },
        h('label', { style: { fontSize: '13px', fontWeight: '600', color: 'var(--gray-600)', display: 'block', marginBottom: '6px' } }, 'URL'),
        h('input', {
          className: 'url-input',
          type: 'url',
          placeholder: 'https://example.com/article...',
          value: state.urlInput,
          oninput: (e) => { state.urlInput = e.target.value; },
          onkeydown: (e) => { if (e.key === 'Enter') saveUrl(); },
          style: { width: '100%' }
        })
      ),
      // Format selection
      h('div', { style: { marginBottom: '20px' } },
        h('label', { style: { fontSize: '13px', fontWeight: '600', color: 'var(--gray-600)', display: 'block', marginBottom: '8px' } }, 'Content Formats'),
        h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' } },
          ...allFormats.map(f =>
            h('label', {
              style: {
                display: 'flex', alignItems: 'center', gap: '8px', padding: '10px 12px',
                background: state.urlFormats[f.key] ? 'var(--blue)08' : 'var(--gray-50)',
                border: `1px solid ${state.urlFormats[f.key] ? 'var(--blue)' : 'var(--gray-200)'}`,
                borderRadius: '8px', cursor: 'pointer', fontSize: '13px', transition: 'all 0.15s ease'
              }
            },
              h('input', {
                type: 'checkbox',
                checked: state.urlFormats[f.key],
                onchange: () => { state.urlFormats[f.key] = !state.urlFormats[f.key]; render(); },
                style: { accentColor: 'var(--blue)' }
              }),
              f.label
            )
          )
        ),
        h('div', { style: { display: 'flex', gap: '8px', marginTop: '8px' } },
          h('button', {
            className: 'btn btn-outline btn-sm',
            onclick: () => { for (const k in state.urlFormats) state.urlFormats[k] = true; render(); }
          }, 'Select All'),
          h('button', {
            className: 'btn btn-outline btn-sm',
            onclick: () => { for (const k in state.urlFormats) state.urlFormats[k] = false; render(); }
          }, 'Clear All')
        )
      ),
      // Actions
      h('div', { style: { display: 'flex', gap: '12px', alignItems: 'center' } },
        h('button', {
          className: 'btn btn-primary',
          onclick: () => { state.urlQueueOnly = false; saveUrl(); },
          disabled: state.savingUrl || !state.urlInput.trim() || !Object.values(state.urlFormats).some(v => v)
        }, state.savingUrl && !state.urlQueueOnly
          ? h('div', { style: { display: 'flex', alignItems: 'center', gap: '8px' } },
              h('span', { className: 'spinner' }), 'Generating...')
          : 'Generate Now'),
        h('button', {
          className: 'btn btn-outline',
          onclick: () => { state.urlQueueOnly = true; saveUrl(); },
          disabled: state.savingUrl || !state.urlInput.trim()
        }, state.savingUrl && state.urlQueueOnly
          ? h('div', { style: { display: 'flex', alignItems: 'center', gap: '8px' } },
              h('span', { className: 'spinner' }), 'Adding...')
          : 'Add to Queue'),
        h('span', { style: { fontSize: '12px', color: 'var(--gray-400)' } },
          Object.values(state.urlFormats).filter(v => v).length + ' formats selected'
        )
      )
    ),
    // Previously saved URLs
    h('div', { style: { maxWidth: '700px', marginTop: '24px' } },
      h('h4', { style: { fontSize: '14px', color: 'var(--gray-500)', marginBottom: '12px' } },
        urlTriggers.length > 0 ? `Previously Saved (${urlTriggers.length})` : 'Previously Saved'
      ),
      urlTriggers.length > 0
        ? h('div', { className: 'card' },
            ...urlTriggers.slice(0, 10).map(t =>
              h('div', { style: { padding: '12px 16px', borderBottom: '1px solid var(--gray-100)', display: 'flex', alignItems: 'center', gap: '12px' } },
                h('span', { className: 'badge badge-url' }, 'url'),
                h('span', { style: { flex: '1', fontSize: '14px' } }, t.title),
                t.requested_formats
                  ? h('span', { style: { fontSize: '10px', color: 'var(--gray-400)' } }, t.requested_formats.join(', '))
                  : null,
                h('span', { style: { fontSize: '11px', color: 'var(--gray-400)' } }, timeAgo(t.captured_at))
              )
            )
          )
        : h('p', { style: { fontSize: '13px', color: 'var(--gray-400)' } }, 'No saved URLs yet — paste a URL above to get started')
    )
  );
}

function renderInspirationsPage() {
  const items = state.inspirations || [];
  const unused = items.filter(i => !i.used);
  const used = items.filter(i => i.used);

  return h('div', { className: 'page-content' },
    // Stats
    h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '16px', marginBottom: '20px' } },
      meetingStatCard('Total', items.length),
      meetingStatCard('Available', unused.length),
      meetingStatCard('Used', used.length)
    ),
    // Actions bar
    h('div', { style: { display: 'flex', gap: '12px', marginBottom: '20px', alignItems: 'center' } },
      h('button', { className: 'btn btn-primary btn-sm', onclick: async () => {
        try {
          const res = await api('/api/inspirations/sync', { method: 'POST' });
          toast(`Synced ${res.added} inspirations from meeting insights`, 'success');
          await loadData();
        } catch (err) { toast(err.message, 'error'); }
      } }, 'Sync from Meetings'),
      h('div', { style: { flex: 1 } }),
      h('input', {
        type: 'text', placeholder: 'Add inspiration...',
        style: { padding: '6px 10px', borderRadius: 'var(--radius-sm)', border: '1px solid var(--gray-200)', fontSize: '13px', width: '300px' },
        value: state.newInspiration || '',
        oninput: (e) => { state.newInspiration = e.target.value; }
      }),
      h('button', {
        className: 'btn btn-outline btn-sm',
        disabled: !(state.newInspiration || '').trim(),
        onclick: async () => {
          try {
            await api('/api/inspirations', { method: 'POST', body: { content: state.newInspiration.trim(), source: 'manual' } });
            state.newInspiration = ''; toast('Added!', 'success'); await loadData();
          } catch (err) { toast(err.message, 'error'); }
        }
      }, 'Add')
    ),
    // Inspiration cards
    unused.length === 0
      ? h('div', { className: 'card', style: { textAlign: 'center', padding: '40px', color: 'var(--gray-400)' } },
          h('p', {}, 'No inspirations yet'),
          h('p', { style: { fontSize: '13px', marginTop: '8px' } }, 'Click "Sync from Meetings" to populate from call insights')
        )
      : h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '12px' } },
          ...unused.map(insp =>
            h('div', { className: 'card', style: { padding: '16px' } },
              h('div', { style: { display: 'flex', gap: '6px', marginBottom: '8px', flexWrap: 'wrap' } },
                h('span', { style: {
                  background: 'var(--purple-light)', color: 'var(--purple)',
                  padding: '1px 6px', borderRadius: '8px', fontSize: '10px', fontWeight: '600'
                } }, insp.source),
                ...(insp.tags || []).map(t =>
                  h('span', { style: {
                    background: 'var(--gray-100)', color: 'var(--gray-600)',
                    padding: '1px 6px', borderRadius: '8px', fontSize: '10px'
                  } }, t)
                )
              ),
              h('p', { style: { fontSize: '13px', lineHeight: '1.6', marginBottom: '12px' } }, insp.content),
              h('div', { style: { display: 'flex', gap: '8px' } },
                h('button', { className: 'btn btn-success btn-sm', onclick: async () => {
                  try {
                    const res = await api(`/api/inspirations/${insp.id}/use`, { method: 'POST' });
                    toast('Trigger created from inspiration!', 'success'); await loadData();
                  } catch (err) { toast(err.message, 'error'); }
                } }, 'Use as Trigger'),
                h('button', { className: 'btn btn-ghost btn-sm', onclick: async () => {
                  try {
                    await api(`/api/inspirations/${insp.id}`, { method: 'DELETE' });
                    toast('Removed', 'info'); await loadData();
                  } catch (err) { toast(err.message, 'error'); }
                } }, 'Remove')
              )
            )
          )
        )
  );
}

function renderToasts() {
  return h('div', { className: 'toast-container' },
    ...state.toasts.map(t =>
      h('div', { className: `toast toast-${t.type}`, key: t.id }, t.msg)
    )
  );
}

function render() {
  const app = document.getElementById('app');
  const newApp = h('div', { className: 'app' },
    renderSidebar(),
    h('div', { className: 'main-content' },
      renderTopbar(),
      state.loading
        ? h('div', { style: { display: 'flex', justifyContent: 'center', padding: '60px' } },
            h('div', { className: 'spinner', style: { width: '32px', height: '32px' } })
          )
        : state.page === 'chat' ? renderChatPage()
        : state.page === 'dashboard' ? renderDashboardPage()
        : state.page === 'pipeline' ? renderPipelinePage()
        : state.page === 'meetings' ? renderMeetingsPage()
        : state.page === 'clients' ? renderClientsPage()
        : state.page === 'actions' ? renderActionsPage()
        : state.page === 'pestering' ? renderPesteringPage()
        : state.page === 'insights' ? renderInsightsPage()
        : state.page === 'deals' ? renderDealsPage()
        : state.page === 'content' ? renderContentPage()
        : state.page === 'triggers' ? renderTriggersPage()
        : state.page === 'calendar' ? renderCalendarPage()
        : state.page === 'analytics' ? renderAnalyticsPage()
        : state.page === 'inspirations' ? renderInspirationsPage()
        : state.page === 'performance' ? renderPerformancePage()
        : state.page === 'playbooks' ? renderPlaybooksPage()
        : state.page === 'series' ? renderSeriesPage()
        : state.page === 'publish-tracker' ? renderPublishTrackerPage()
        : state.page === 'settings' ? renderSettingsPage()
        : state.page === 'memory' ? renderMemoryPage()
        : state.page === 'save-url' ? renderSaveUrlPage()
        : renderDashboardPage()
    ),
    // Quick Capture floating button
    h('button', {
      className: 'capture-fab',
      onclick: () => { state.showCapture = !state.showCapture; render(); },
      title: 'Quick Capture — save an idea'
    }, '+'),
    // Quick Capture modal
    state.showCapture
      ? h('div', { className: 'modal-overlay', onclick: (e) => { if (e.target.classList.contains('modal-overlay')) { state.showCapture = false; render(); } } },
          h('div', { className: 'capture-modal' },
            h('h3', { style: { fontFamily: "'Fraunces', serif", marginBottom: '12px' } }, 'Quick Capture'),
            h('textarea', {
              placeholder: 'Capture an idea, observation, or content topic...',
              value: state.captureText || '',
              oninput: (e) => { state.captureText = e.target.value; },
              style: { width: '100%', padding: '12px', border: '1px solid var(--gray-200)', borderRadius: '8px', fontSize: '14px', fontFamily: "'Outfit', sans-serif", minHeight: '120px', resize: 'vertical' },
              autofocus: true
            }),
            h('div', { style: { display: 'flex', gap: '8px', marginTop: '12px', justifyContent: 'flex-end' } },
              h('button', {
                className: 'btn btn-ghost btn-sm',
                onclick: () => { state.showCapture = false; state.captureText = ''; render(); }
              }, 'Cancel'),
              h('button', {
                className: 'btn btn-primary btn-sm',
                disabled: !(state.captureText || '').trim(),
                onclick: async () => {
                  try {
                    await api('/api/capture', { method: 'POST', body: { text: state.captureText.trim() } });
                    toast('Idea captured!', 'success');
                    state.showCapture = false;
                    state.captureText = '';
                    await loadData();
                  } catch (err) { toast('Capture failed: ' + err.message, 'error'); }
                }
              }, 'Save'),
              h('button', {
                className: 'btn btn-success btn-sm',
                disabled: !(state.captureText || '').trim(),
                onclick: async () => {
                  try {
                    toast('Capturing and generating...', 'info');
                    const res = await api('/api/capture', { method: 'POST', body: { text: state.captureText.trim() } });
                    state.showCapture = false;
                    state.captureText = '';
                    if (res.trigger) await generateForTrigger(res.trigger.id);
                    await loadData();
                  } catch (err) { toast('Capture failed: ' + err.message, 'error'); }
                }
              }, 'Save & Generate')
            )
          )
        )
      : null,
    // Rejection feedback modal
    state._rejectModal
      ? h('div', { className: 'modal-overlay', onclick: (e) => { if (e.target.classList.contains('modal-overlay')) { state._rejectModal = null; render(); } } },
          h('div', { className: 'capture-modal', style: { maxWidth: '420px' } },
            h('h3', { style: { fontFamily: "'Fraunces', serif", marginBottom: '16px' } }, 'Why are you rejecting this?'),
            h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '8px', marginBottom: '16px' } },
              ...['too_generic', 'wrong_tone', 'missing_numbers', 'bad_hook', 'off_brand', 'other'].map(reason => {
                const labels = { too_generic: 'Too Generic', wrong_tone: 'Wrong Tone', missing_numbers: 'No Numbers', bad_hook: 'Bad Hook', off_brand: 'Off Brand', other: 'Other' };
                const isSelected = state._rejectModal.reason === reason;
                return h('button', {
                  className: `btn btn-sm ${isSelected ? 'btn-primary' : 'btn-ghost'}`,
                  style: { fontSize: '12px' },
                  onclick: () => { state._rejectModal.reason = reason; render(); }
                }, labels[reason]);
              })
            ),
            h('input', {
              type: 'text',
              placeholder: 'Quick note (optional)',
              value: state._rejectModal.note,
              style: { width: '100%', padding: '8px 12px', borderRadius: '6px', border: '1px solid var(--gray-200)', marginBottom: '10px', fontSize: '13px', background: 'var(--white)', color: 'var(--gray-700)' },
              oninput: (e) => { state._rejectModal.note = e.target.value; }
            }),
            h('input', {
              type: 'text',
              placeholder: 'Suggestion for improvement (optional)',
              value: state._rejectModal.suggestion,
              style: { width: '100%', padding: '8px 12px', borderRadius: '6px', border: '1px solid var(--gray-200)', marginBottom: '16px', fontSize: '13px', background: 'var(--white)', color: 'var(--gray-700)' },
              oninput: (e) => { state._rejectModal.suggestion = e.target.value; }
            }),
            h('div', { style: { display: 'flex', gap: '8px', justifyContent: 'flex-end' } },
              h('button', { className: 'btn btn-ghost', onclick: () => { state._rejectModal = null; render(); } }, 'Cancel'),
              h('button', { className: 'btn btn-primary', onclick: submitRejection }, 'Reject with Feedback')
            )
          )
        )
      : null,
    // Keyboard shortcuts modal
    state._showShortcuts
      ? h('div', { className: 'modal-overlay', onclick: (e) => { if (e.target.classList.contains('modal-overlay')) { state._showShortcuts = false; render(); } } },
          h('div', { className: 'capture-modal', style: { maxWidth: '480px' } },
            h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' } },
              h('h3', { style: { fontFamily: "'Fraunces', serif" } }, 'Keyboard Shortcuts'),
              h('button', { className: 'btn btn-ghost btn-sm', onclick: () => { state._showShortcuts = false; render(); } }, 'Esc')
            ),
            ...[
              ['Navigation', [
                ['1', 'Dashboard'],
                ['2', 'Pipeline'],
                ['3', 'Meetings'],
                ['4', 'Clients'],
                ['5', 'Actions'],
                ['c', 'Content page'],
                ['t', 'Triggers page'],
                ['l', 'Analytics page'],
                ['n', 'Calendar page']
              ]],
              ['Content Review', [
                ['j / k', 'Next / previous item'],
                ['Space', 'Select / deselect item'],
                ['a', 'Approve selected format'],
                ['r', 'Reject selected format']
              ]],
              ['General', [
                ['?', 'Toggle this help'],
                ['Esc', 'Close modals / cancel edit'],
                ['/', 'Focus search box'],
                ['d', 'Toggle dark mode']
              ]]
            ].map(([section, keys]) =>
              h('div', { style: { marginBottom: '16px' } },
                h('h4', { style: { fontSize: '12px', color: 'var(--gray-400)', textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: '8px' } }, section),
                ...keys.map(([key, desc]) =>
                  h('div', { style: { display: 'flex', justifyContent: 'space-between', padding: '4px 0', fontSize: '13px' } },
                    h('span', { style: { color: 'var(--gray-500)' } }, desc),
                    h('kbd', { style: { background: 'var(--gray-100)', padding: '2px 8px', borderRadius: '4px', fontSize: '12px', fontFamily: 'monospace', border: '1px solid var(--gray-200)' } }, key)
                  )
                )
              )
            )
          )
        )
      : null,
    renderToasts()
  );

  app.innerHTML = '';
  app.appendChild(newApp);

  // Restore textarea content after render if editing
  if (state.editingFormat) {
    const ta = document.querySelector('.edit-textarea');
    if (ta && ta.value !== state.editText) {
      ta.value = state.editText;
    }
  }
}

// --- Init ---
loadData();

// Auto-refresh: 60s on dashboard, 120s on other pages (keeps data fresh everywhere)
setInterval(() => {
  if (!state.loading && document.visibilityState === 'visible') {
    loadData();
  }
}, state.page === 'dashboard' ? 60000 : 120000);
</script>
</body>
</html>
