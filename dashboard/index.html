      h('div', { style: { flex: 1 } }),
      h('input', {
        type: 'text', placeholder: 'Add inspiration...',
        style: { padding: '6px 10px', borderRadius: 'var(--radius-sm)', border: '1px solid var(--gray-200)', fontSize: '13px', width: '300px' },
        value: state.newInspiration || '',
        oninput: (e) => { state.newInspiration = e.target.value; }
      }),
      h('button', {
        className: 'btn btn-outline btn-sm',
        disabled: !(state.newInspiration || '').trim(),
        onclick: async () => {
          try {
            await api('/api/inspirations', { method: 'POST', body: { content: state.newInspiration.trim(), source: 'manual' } });
            state.newInspiration = ''; toast('Added!', 'success'); await loadData();
          } catch (err) { toast(err.message, 'error'); }
        }
      }, 'Add')
    ),
    // Inspiration cards
    unused.length === 0
      ? h('div', { className: 'card', style: { textAlign: 'center', padding: '40px', color: 'var(--gray-400)' } },
          h('p', {}, 'No inspirations yet'),
          h('p', { style: { fontSize: '13px', marginTop: '8px' } }, 'Click "Sync from Meetings" to populate from call insights')
        )
      : h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '12px' } },
          ...unused.map(insp =>
            h('div', { className: 'card', style: { padding: '16px' } },
              h('div', { style: { display: 'flex', gap: '6px', marginBottom: '8px', flexWrap: 'wrap' } },
                h('span', { style: {
                  background: 'var(--purple-light)', color: 'var(--purple)',
                  padding: '1px 6px', borderRadius: '8px', fontSize: '10px', fontWeight: '600'
                } }, insp.source),
                ...(insp.tags || []).map(t =>
                  h('span', { style: {
                    background: 'var(--gray-100)', color: 'var(--gray-600)',
                    padding: '1px 6px', borderRadius: '8px', fontSize: '10px'
                  } }, t)
                )
              ),
              h('p', { style: { fontSize: '13px', lineHeight: '1.6', marginBottom: '12px' } }, insp.content),
              h('div', { style: { display: 'flex', gap: '8px' } },
                h('button', { className: 'btn btn-success btn-sm', onclick: async () => {
                  try {
                    const res = await api(`/api/inspirations/${insp.id}/use`, { method: 'POST' });
                    toast('Trigger created from inspiration!', 'success'); await loadData();
                  } catch (err) { toast(err.message, 'error'); }
                } }, 'Use as Trigger'),
                h('button', { className: 'btn btn-ghost btn-sm', onclick: async () => {
                  try {
                    await api(`/api/inspirations/${insp.id}`, { method: 'DELETE' });
                    toast('Removed', 'info'); await loadData();
                  } catch (err) { toast(err.message, 'error'); }
                } }, 'Remove')
              )
            )
          )
        )
  );
}

function renderToasts() {
  return h('div', { className: 'toast-container' },
    ...state.toasts.map(t =>
      h('div', { className: `toast toast-${t.type}`, key: t.id }, t.msg)
    )
  );
}

function render() {
  const app = document.getElementById('app');
  const newApp = h('div', { className: 'app' },
    renderSidebar(),
    h('div', { className: 'main-content' },
      renderTopbar(),
      state.loading
        ? h('div', { style: { display: 'flex', justifyContent: 'center', padding: '60px' } },
            h('div', { className: 'spinner', style: { width: '32px', height: '32px' } })
          )
        : state.page === 'chat' ? renderChatPage()
        : state.page === 'dashboard' ? renderDashboardPage()
        : state.page === 'pipeline' ? renderPipelinePage()
        : state.page === 'meetings' ? renderMeetingsPage()
        : state.page === 'clients' ? renderClientsPage()
        : state.page === 'actions' ? renderActionsPage()
        : state.page === 'pestering' ? renderPesteringPage()
        : state.page === 'insights' ? renderInsightsPage()
        : state.page === 'deals' ? renderDealsPage()
        : state.page === 'content' ? renderContentPage()
        : state.page === 'triggers' ? renderTriggersPage()
        : state.page === 'calendar' ? renderCalendarPage()
        : state.page === 'analytics' ? renderAnalyticsPage()
        : state.page === 'inspirations' ? renderInspirationsPage()
        : state.page === 'performance' ? renderPerformancePage()
        : state.page === 'settings' ? renderSettingsPage()
        : state.page === 'memory' ? renderMemoryPage()
        : state.page === 'save-url' ? renderSaveUrlPage()
        : renderDashboardPage()
    ),
    // Quick Capture floating button
    h('button', {
      className: 'capture-fab',
      onclick: () => { state.showCapture = !state.showCapture; render(); },
      title: 'Quick Capture — save an idea'
    }, '+'),
    // Quick Capture modal
    state.showCapture
      ? h('div', { className: 'modal-overlay', onclick: (e) => { if (e.target.classList.contains('modal-overlay')) { state.showCapture = false; render(); } } },
          h('div', { className: 'capture-modal' },
            h('h3', { style: { fontFamily: "'Fraunces', serif", marginBottom: '12px' } }, 'Quick Capture'),
            h('textarea', {
              placeholder: 'Capture an idea, observation, or content topic...',
              value: state.captureText || '',
              oninput: (e) => { state.captureText = e.target.value; },
              style: { width: '100%', padding: '12px', border: '1px solid var(--gray-200)', borderRadius: '8px', fontSize: '14px', fontFamily: "'Outfit', sans-serif", minHeight: '120px', resize: 'vertical' },
              autofocus: true
            }),
            h('div', { style: { display: 'flex', gap: '8px', marginTop: '12px', justifyContent: 'flex-end' } },
              h('button', {
                className: 'btn btn-ghost btn-sm',
                onclick: () => { state.showCapture = false; state.captureText = ''; render(); }
              }, 'Cancel'),
              h('button', {
                className: 'btn btn-primary btn-sm',
                disabled: !(state.captureText || '').trim(),
                onclick: async () => {
                  try {
                    await api('/api/capture', { method: 'POST', body: { text: state.captureText.trim() } });
                    toast('Idea captured!', 'success');
                    state.showCapture = false;
                    state.captureText = '';
                    await loadData();
                  } catch (err) { toast('Capture failed: ' + err.message, 'error'); }
                }
              }, 'Save'),
              h('button', {
                className: 'btn btn-success btn-sm',
                disabled: !(state.captureText || '').trim(),
                onclick: async () => {
                  try {
                    toast('Capturing and generating...', 'info');
                    const res = await api('/api/capture', { method: 'POST', body: { text: state.captureText.trim() } });
                    state.showCapture = false;
                    state.captureText = '';
                    if (res.trigger) await generateForTrigger(res.trigger.id);
                    await loadData();
                  } catch (err) { toast('Capture failed: ' + err.message, 'error'); }
                }
              }, 'Save & Generate')
            )
          )
        )
      : null,
    // Keyboard shortcuts modal
    state._showShortcuts
      ? h('div', { className: 'modal-overlay', onclick: (e) => { if (e.target.classList.contains('modal-overlay')) { state._showShortcuts = false; render(); } } },
          h('div', { className: 'capture-modal', style: { maxWidth: '480px' } },
            h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' } },
              h('h3', { style: { fontFamily: "'Fraunces', serif" } }, 'Keyboard Shortcuts'),
              h('button', { className: 'btn btn-ghost btn-sm', onclick: () => { state._showShortcuts = false; render(); } }, 'Esc')
            ),
            ...[
              ['Navigation', [
                ['1-7', 'Switch pages'],
                ['c', 'Content page'],
                ['t', 'Triggers page'],
                ['9', 'Meetings page']
              ]],
              ['Content Review', [
                ['j / k', 'Next / previous item'],
                ['Space', 'Select / deselect item'],
                ['a', 'Approve selected format'],
                ['r', 'Reject selected format']
              ]],
              ['General', [
                ['?', 'Toggle this help'],
                ['Esc', 'Close modals / cancel edit'],
                ['/', 'Focus search box'],
                ['d', 'Toggle dark mode']
              ]]
            ].map(([section, keys]) =>
              h('div', { style: { marginBottom: '16px' } },
                h('h4', { style: { fontSize: '12px', color: 'var(--gray-400)', textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: '8px' } }, section),
                ...keys.map(([key, desc]) =>
                  h('div', { style: { display: 'flex', justifyContent: 'space-between', padding: '4px 0', fontSize: '13px' } },
                    h('span', { style: { color: 'var(--gray-500)' } }, desc),
                    h('kbd', { style: { background: 'var(--gray-100)', padding: '2px 8px', borderRadius: '4px', fontSize: '12px', fontFamily: 'monospace', border: '1px solid var(--gray-200)' } }, key)
                  )
                )
              )
            )
          )
        )
      : null,
    renderToasts()
  );

  app.innerHTML = '';
  app.appendChild(newApp);

  // Restore textarea content after render if editing
  if (state.editingFormat) {
    const ta = document.querySelector('.edit-textarea');
    if (ta && ta.value !== state.editText) {
      ta.value = state.editText;
    }
  }
}

// --- Init ---
loadData();

// Auto-refresh: 60s on dashboard, 120s on other pages (keeps data fresh everywhere)
setInterval(() => {
  if (!state.loading && document.visibilityState === 'visible') {
    loadData();
  }
}, state.page === 'dashboard' ? 60000 : 120000);
</script>
</body>
</html>
