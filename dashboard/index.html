function renderAnalyticsPage() {
  const content = state.content;
  const triggers = state.triggers;
  const s = state.stats;
  if (!s) return h('div', { className: 'page-content' }, h('div', { className: 'spinner' }));
  if (content.length === 0 && triggers.length === 0) {
    return h('div', { className: 'page-content' },
      h('div', { className: 'card', style: { textAlign: 'center', padding: '40px', color: 'var(--gray-400)' } },
        h('div', { innerHTML: icons.analytics, style: { width: '48px', height: '48px', margin: '0 auto 12px', opacity: '0.3' } }),
        h('p', {}, 'No analytics data yet'),
        h('p', { style: { fontSize: '13px', marginTop: '8px' } }, 'Generate content from triggers to see performance analytics')
      )
    );
  }

  // Calculate metrics
  const totalFormats = Object.values(content).reduce((sum, c) =>
    sum + Object.keys(c.formats || {}).length, 0);
  const approvedFormats = Object.values(content).reduce((sum, c) =>
    sum + Object.values(c.formats || {}).filter(f => f.status === 'approved').length, 0);
  const rejectedFormats = Object.values(content).reduce((sum, c) =>
    sum + Object.values(c.formats || {}).filter(f => f.status === 'rejected').length, 0);
  const reviewFormats = totalFormats - approvedFormats - rejectedFormats;
  const approvalRate = totalFormats > 0 ? Math.round((approvedFormats / totalFormats) * 100) : 0;

  // Format breakdown
  const formatCounts = {};
  for (const c of content) {
    for (const [key, fmt] of Object.entries(c.formats || {})) {
      if (!formatCounts[key]) formatCounts[key] = { total: 0, approved: 0, rejected: 0, review: 0 };
      formatCounts[key].total++;
      formatCounts[key][fmt.status || 'review']++;
    }
  }

  // Source performance
  const sourceCounts = {};
  for (const c of content) {
    const src = c.trigger_source || 'unknown';
    if (!sourceCounts[src]) sourceCounts[src] = { total: 0, approved: 0 };
    sourceCounts[src].total++;
    if (c.status === 'approved') sourceCounts[src].approved++;
  }

  // Pillar distribution
  const pillarCounts = {};
  for (const c of content) {
    const p = categoryToPillar(c.trigger_category).label;
    pillarCounts[p] = (pillarCounts[p] || 0) + 1;
  }

  // Category distribution
  const catCounts = {};
  for (const t of triggers) {
    const cat = categoryLabel(t.category);
    catCounts[cat] = (catCounts[cat] || 0) + 1;
  }

  // Score distribution
  const scoreBuckets = { '0-5': 0, '6-10': 0, '11-15': 0, '16-20': 0, '21+': 0 };
  for (const t of triggers) {
    const sc = t.score || 0;
    if (sc <= 5) scoreBuckets['0-5']++;
    else if (sc <= 10) scoreBuckets['6-10']++;
    else if (sc <= 15) scoreBuckets['11-15']++;
    else if (sc <= 20) scoreBuckets['16-20']++;
    else scoreBuckets['21+']++;
  }

  const donutSvg = buildDonutSVG(approvedFormats, reviewFormats, rejectedFormats);

  return h('div', { className: 'page-content' },
    // Key metrics row
    h('div', { className: 'stats-grid' },
      statCard('Approval Rate', approvalRate + '%', `${approvedFormats} of ${totalFormats} formats`, 'green'),
      statCard('Pipeline Health', content.filter(c => c.status === 'review').length, 'pieces in review', 'amber'),
      statCard('Avg Score', triggers.length ? Math.round(triggers.reduce((s,t) => s + (t.score||0), 0) / triggers.length) : 0, 'trigger quality score', 'accent'),
      statCard('Content Sources', Object.keys(s.triggers.by_source || {}).length, 'active sources feeding pipeline', 'purple')
    ),
    // Charts row
    h('div', { className: 'analytics-grid' },
      // Donut chart — format status
      h('div', { className: 'chart-card' },
        h('h4', {}, 'Format Status Breakdown'),
        h('div', { style: { display: 'flex', alignItems: 'center', gap: '24px' } },
          h('div', { className: 'donut-chart', innerHTML: donutSvg }),
          h('div', { style: { flex: '1' } },
            h('div', { className: 'metric-row' },
              h('span', { className: 'metric-label' }, h('span', { style: { display: 'inline-block', width: '8px', height: '8px', borderRadius: '50%', background: 'var(--green)', marginRight: '6px' } }), 'Approved'),
              h('span', { className: 'metric-value' }, String(approvedFormats))
            ),
            h('div', { className: 'metric-row' },
              h('span', { className: 'metric-label' }, h('span', { style: { display: 'inline-block', width: '8px', height: '8px', borderRadius: '50%', background: 'var(--amber)', marginRight: '6px' } }), 'In Review'),
              h('span', { className: 'metric-value' }, String(reviewFormats))
            ),
            h('div', { className: 'metric-row' },
              h('span', { className: 'metric-label' }, h('span', { style: { display: 'inline-block', width: '8px', height: '8px', borderRadius: '50%', background: 'var(--red)', marginRight: '6px' } }), 'Rejected'),
              h('span', { className: 'metric-value' }, String(rejectedFormats))
            )
          )
        )
      ),
      // Bar chart — trigger score distribution
      h('div', { className: 'chart-card' },
        h('h4', {}, 'Trigger Score Distribution'),
        h('div', { className: 'bar-chart' },
          ...Object.entries(scoreBuckets).map(([range, count]) => {
            const maxCount = Math.max(...Object.values(scoreBuckets), 1);
            return h('div', { className: 'bar-col' },
              h('div', { className: 'bar-value' }, String(count)),
              h('div', {
                className: 'bar-fill',
                style: { height: `${(count/maxCount)*130}px`, background: 'var(--blue)' }
              }),
              h('div', { className: 'bar-label' }, range)
            );
          })
        )
      )
    ),
    // Second row
    h('div', { className: 'analytics-grid' },
      // Format performance
      h('div', { className: 'chart-card' },
        h('h4', {}, 'Performance by Format'),
        h('div', { className: 'bar-chart' },
          ...Object.entries(formatCounts).map(([key, counts]) => {
            const maxCount = Math.max(...Object.values(formatCounts).map(c => c.total), 1);
            return h('div', { className: 'bar-col' },
              h('div', { className: 'bar-value' }, `${counts.approved}/${counts.total}`),
              h('div', { style: { width: '100%', height: `${(counts.total/maxCount)*130}px`, display: 'flex', flexDirection: 'column', borderRadius: '4px 4px 0 0', overflow: 'hidden' } },
                h('div', { style: { flex: counts.rejected, background: 'var(--red)' } }),
                h('div', { style: { flex: counts.review, background: 'var(--amber)' } }),
                h('div', { style: { flex: counts.approved, background: 'var(--green)' } })
              ),
              h('div', { className: 'bar-label' }, formatName(key).replace(' Script', ''))
            );
          })
        )
      ),
      // Content pillar distribution
      h('div', { className: 'chart-card' },
        h('h4', {}, 'Content Pillar Mix'),
        h('div', { style: { display: 'flex', flexDirection: 'column', gap: '12px', marginTop: '8px' } },
          ...Object.entries(pillarCounts).sort((a,b) => b[1]-a[1]).map(([pillar, count]) => {
            const maxCount = Math.max(...Object.values(pillarCounts));
            const pillarColor = { 'Hot Take': '#dc2626', 'Tactical How-To': '#2563eb', 'Industry Insight': '#059669', 'Social Proof': '#d97706', 'General': '#64748b' }[pillar] || '#94a3b8';
            return h('div', { style: { display: 'flex', alignItems: 'center', gap: '10px' } },
              h('span', { style: { fontSize: '12px', fontWeight: '600', width: '110px', color: 'var(--gray-500)' } }, pillar),
              h('div', { style: { flex: '1', height: '20px', background: 'var(--gray-100)', borderRadius: '4px', overflow: 'hidden' } },
                h('div', { style: { width: `${(count/maxCount)*100}%`, height: '100%', background: pillarColor, borderRadius: '4px', transition: 'width 0.5s ease', display: 'flex', alignItems: 'center', paddingLeft: '8px' } },
                  h('span', { style: { fontSize: '11px', fontWeight: '700', color: 'white' } }, String(count))
                )
              )
            );
          })
        ),
        h('div', { style: { marginTop: '16px', padding: '12px', background: 'var(--gray-50)', borderRadius: 'var(--radius-sm)' } },
          h('div', { style: { fontSize: '11px', color: 'var(--gray-400)', marginBottom: '4px' } }, 'TARGET MIX'),
          h('div', { style: { fontSize: '12px', color: 'var(--gray-500)' } },
            'Insight 35% | How-To 25% | Social Proof 20% | Hot Takes 10% | BTS 10%'
          )
        )
      )
    ),
    // Third row — source performance + category breakdown
    h('div', { className: 'analytics-grid' },
      h('div', { className: 'chart-card' },
        h('h4', {}, 'Content by Source'),
        h('div', { style: { display: 'flex', flexDirection: 'column', gap: '8px' } },
          ...Object.entries(sourceCounts).sort((a,b) => b[1].total - a[1].total).map(([src, data]) => {
            const maxCount = Math.max(...Object.values(sourceCounts).map(d => d.total));
            const colors = { reddit: '#ff4500', rss: '#2563eb', youtube: '#cc0000', url: '#7c3aed', competitor: '#0891b2', question: '#ea580c', 'google-news': '#4285f4', hackernews: '#ff6600', manual: '#7c3aed' };
            return h('div', { style: { display: 'flex', alignItems: 'center', gap: '10px' } },
              h('span', { style: { fontSize: '12px', fontWeight: '600', width: '100px', color: 'var(--gray-500)' } }, sourceLabel(src)),
              h('div', { style: { flex: '1', height: '12px', background: 'var(--gray-100)', borderRadius: '6px', overflow: 'hidden' } },
                h('div', { style: { width: `${(data.total/maxCount)*100}%`, height: '100%', background: colors[src] || '#94a3b8', borderRadius: '6px' } })
              ),
              h('span', { style: { fontSize: '12px', fontWeight: '700', color: 'var(--gray-600)', minWidth: '30px', textAlign: 'right' } }, String(data.total))
            );
          })
        )
      ),
      h('div', { className: 'chart-card' },
        h('h4', {}, 'Trigger Categories'),
        h('div', { className: 'bar-chart' },
          ...Object.entries(catCounts).sort((a,b) => b[1]-a[1]).map(([cat, count]) => {
            const maxCount = Math.max(...Object.values(catCounts), 1);
            const catColors = { 'Pain Point': '#dc2626', 'Question': '#2563eb', 'Data & Stats': '#059669', 'Industry News': '#d97706', 'Content Idea': '#7c3aed', 'Client Win': '#0891b2' };
            return h('div', { className: 'bar-col' },
              h('div', { className: 'bar-value' }, String(count)),
              h('div', {
                className: 'bar-fill',
                style: { height: `${(count/maxCount)*130}px`, background: catColors[cat] || '#94a3b8' }
              }),
              h('div', { className: 'bar-label' }, cat)
            );
          })
        )
      )
    ),
    // Fourth row — quality scores + top content
    h('div', { className: 'analytics-grid' },
      // Quality score distribution
      h('div', { className: 'chart-card' },
        h('h4', {}, 'Content Quality Scores'),
        (() => {
          const scored = content.filter(c => c.quality_score?.score != null);
          if (scored.length === 0) return h('div', { style: { fontSize: '13px', color: 'var(--gray-400)', padding: '20px 0' } }, 'No quality scores yet — generate new content to see scores');
          const buckets = { 'Excellent (80+)': 0, 'Good (60-79)': 0, 'Fair (40-59)': 0, 'Weak (<40)': 0 };
          const bucketColors = { 'Excellent (80+)': '#059669', 'Good (60-79)': '#2563eb', 'Fair (40-59)': '#d97706', 'Weak (<40)': '#dc2626' };
          scored.forEach(c => {
            const s = c.quality_score.score;
            if (s >= 80) buckets['Excellent (80+)']++;
            else if (s >= 60) buckets['Good (60-79)']++;
            else if (s >= 40) buckets['Fair (40-59)']++;
            else buckets['Weak (<40)']++;
          });
          const avg = Math.round(scored.reduce((sum, c) => sum + c.quality_score.score, 0) / scored.length);
          return h('div', {},
            h('div', { style: { fontSize: '36px', fontWeight: '800', color: avg >= 80 ? 'var(--green)' : avg >= 60 ? 'var(--blue)' : 'var(--amber)', fontFamily: "'Fraunces', serif", marginBottom: '12px' } }, `${avg}%`),
            h('div', { style: { fontSize: '12px', color: 'var(--gray-400)', marginBottom: '16px' } }, `Average quality across ${scored.length} pieces`),
            ...Object.entries(buckets).map(([label, count]) =>
              h('div', { style: { display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '8px' } },
                h('span', { style: { fontSize: '12px', width: '110px', color: 'var(--gray-500)' } }, label),
                h('div', { style: { flex: '1', height: '14px', background: 'var(--gray-100)', borderRadius: '7px', overflow: 'hidden' } },
                  h('div', { style: { width: scored.length > 0 ? `${(count/scored.length)*100}%` : '0', height: '100%', background: bucketColors[label], borderRadius: '7px' } })
                ),
                h('span', { style: { fontSize: '12px', fontWeight: '600', minWidth: '24px', textAlign: 'right' } }, String(count))
              )
            )
          );
        })()
      ),
      // Top performing content (most approved formats)
      h('div', { className: 'chart-card' },
        h('h4', {}, 'Top Content Pieces'),
        h('div', { style: { display: 'flex', flexDirection: 'column', gap: '8px' } },
          ...content
            .map(c => ({
              id: c.id,
              title: c.trigger_title || 'Untitled',
              approved: Object.values(c.formats || {}).filter(f => f.status === 'approved').length,
              total: Object.keys(c.formats || {}).length,
              score: c.quality_score?.score || 0
            }))
            .filter(c => c.approved > 0)
            .sort((a, b) => b.approved - a.approved || b.score - a.score)
            .slice(0, 6)
            .map((c, i) =>
              h('div', {
                style: { display: 'flex', alignItems: 'center', gap: '10px', padding: '8px 10px', background: i === 0 ? 'var(--green-light, #f0fdf4)' : 'transparent', borderRadius: '8px', cursor: 'pointer' },
                onclick: () => { state.page = 'content'; state.filter.status = 'all'; state.searchQuery = c.title.slice(0, 30); render(); }
              },
                h('span', { style: { fontSize: '14px', fontWeight: '700', color: 'var(--gray-400)', width: '20px' } }, `${i + 1}`),
                h('div', { style: { flex: '1', overflow: 'hidden' } },
                  h('div', { style: { fontSize: '12px', fontWeight: '500', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' } }, c.title),
                  h('div', { style: { fontSize: '11px', color: 'var(--gray-400)' } }, `${c.approved}/${c.total} approved` + (c.score > 0 ? ` | Quality: ${c.score}%` : ''))
                )
              )
            ),
          content.filter(c => Object.values(c.formats || {}).some(f => f.status === 'approved')).length === 0
            ? h('div', { style: { fontSize: '13px', color: 'var(--gray-400)', padding: '20px 0' } }, 'Approve content to see top performers here')
            : null
        )
      )
    ),
    // Fifth row — generation velocity + trigger health
    h('div', { className: 'analytics-grid' },
      // Generation velocity (content generated per day over last 14 days)
      h('div', { className: 'chart-card' },
        h('h4', {}, 'Generation Velocity (14 days)'),
        (() => {
          const days = [];
          const nowMs = Date.now();
          for (let i = 13; i >= 0; i--) {
            const d = new Date(nowMs - i * 24 * 60 * 60 * 1000);
            const key = d.toISOString().split('T')[0];
            const count = content.filter(c => (c.generated_at || '').startsWith(key)).length;
            days.push({ date: key, label: d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }), count });
          }
          const maxCount = Math.max(...days.map(d => d.count), 1);
          const total = days.reduce((s, d) => s + d.count, 0);
          const avg = (total / 14).toFixed(1);
          return h('div', {},
            h('div', { style: { display: 'flex', gap: '6px', marginBottom: '12px' } },
              h('span', { style: { fontSize: '12px', color: 'var(--gray-400)' } }, `Total: ${total}`),
              h('span', { style: { fontSize: '12px', color: 'var(--gray-400)' } }, `| Avg: ${avg}/day`)
            ),
            h('div', { style: { display: 'flex', alignItems: 'flex-end', gap: '3px', height: '100px' } },
              ...days.map(d =>
                h('div', {
                  style: { flex: '1', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '2px' },
                  title: `${d.date}: ${d.count} generated`
                },
                  d.count > 0 ? h('span', { style: { fontSize: '9px', color: 'var(--gray-400)' } }, String(d.count)) : null,
                  h('div', {
                    style: {
                      width: '100%', minHeight: '2px',
                      height: `${Math.max((d.count / maxCount) * 80, 2)}px`,
                      background: d.count > 0 ? 'var(--blue)' : 'var(--gray-150)',
                      borderRadius: '2px 2px 0 0'
                    }
                  }),
                  h('span', { style: { fontSize: '8px', color: 'var(--gray-300)', whiteSpace: 'nowrap' } }, d.label.split(' ')[1])
                )
              )
            )
          );
        })()
      ),
      // Trigger health summary (fetched from /api/triggers/health)
      h('div', { className: 'chart-card' },
        h('h4', { style: { display: 'flex', alignItems: 'center', gap: '8px' } },
          'Trigger Queue Health',
          h('button', {
            className: 'btn btn-sm btn-outline',
            style: { marginLeft: 'auto', fontSize: '11px' },
            onclick: async () => {
              if (confirm('Archive all stale triggers (21+ days old) and rejected triggers?')) {
                const result = await api('/api/triggers/auto-archive', { method: 'POST', body: { max_age_days: 21 } });
                toast(`Archived ${result.archived} triggers (${result.remaining} remaining)`, 'success');
                loadData();
              }
            }
          }, 'Auto-Archive')
        ),
        (() => {
          const total = triggers.length;
          const pending = triggers.filter(t => t.status === 'pending').length;
          const used = triggers.filter(t => t.status === 'used').length;
          const rejected = triggers.filter(t => t.status === 'rejected').length;
          const nowMs = Date.now();
          const fresh = triggers.filter(t => t.status === 'pending' && (nowMs - new Date(t.captured_at || t.scraped_at || t.date || 0).getTime()) < 3 * 24 * 60 * 60 * 1000).length;
          const stale = triggers.filter(t => t.status === 'pending' && (nowMs - new Date(t.captured_at || t.scraped_at || t.date || 0).getTime()) > 21 * 24 * 60 * 60 * 1000).length;
          const health = fresh > 10 ? 'Good' : fresh > 0 ? 'Fair' : 'Stale';
          const healthColor = fresh > 10 ? 'var(--green)' : fresh > 0 ? 'var(--amber)' : 'var(--red)';
          return h('div', { style: { display: 'flex', flexDirection: 'column', gap: '10px' } },
            h('div', { style: { display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '4px' } },
              h('span', { style: { fontSize: '24px', fontWeight: '800', color: healthColor, fontFamily: "'Fraunces', serif" } }, health),
              h('span', { style: { fontSize: '12px', color: 'var(--gray-400)' } }, `${total} total triggers`)
            ),
            h('div', { style: { display: 'flex', gap: '12px', flexWrap: 'wrap' } },
              h('div', { style: { flex: '1', minWidth: '80px', padding: '8px 12px', background: 'var(--gray-50)', borderRadius: '8px', textAlign: 'center' } },
                h('div', { style: { fontSize: '18px', fontWeight: '700', color: 'var(--green)' } }, String(fresh)),
                h('div', { style: { fontSize: '10px', color: 'var(--gray-400)' } }, 'Fresh (<3d)')
              ),
              h('div', { style: { flex: '1', minWidth: '80px', padding: '8px 12px', background: 'var(--gray-50)', borderRadius: '8px', textAlign: 'center' } },
                h('div', { style: { fontSize: '18px', fontWeight: '700', color: 'var(--amber)' } }, String(pending - fresh - stale)),
                h('div', { style: { fontSize: '10px', color: 'var(--gray-400)' } }, 'Aging')
              ),
              h('div', { style: { flex: '1', minWidth: '80px', padding: '8px 12px', background: 'var(--gray-50)', borderRadius: '8px', textAlign: 'center' } },
                h('div', { style: { fontSize: '18px', fontWeight: '700', color: 'var(--red)' } }, String(stale)),
                h('div', { style: { fontSize: '10px', color: 'var(--gray-400)' } }, 'Stale (21d+)')
              ),
              h('div', { style: { flex: '1', minWidth: '80px', padding: '8px 12px', background: 'var(--gray-50)', borderRadius: '8px', textAlign: 'center' } },
                h('div', { style: { fontSize: '18px', fontWeight: '700', color: 'var(--blue)' } }, String(used)),
                h('div', { style: { fontSize: '10px', color: 'var(--gray-400)' } }, 'Used')
              )
            )
          );
        })()
      )
    ),
    // Sixth row — AI Insights
    renderInsightsSection()
  );
}

function renderInsightsSection() {
  if (!state.analyticsInsights) {
    // Fetch insights in background
    if (!state._analyticsInsightsLoading) {
      state._analyticsInsightsLoading = true;
      api('/api/analytics/insights').then(data => {
        state.analyticsInsights = data;
        state._analyticsInsightsLoading = false;
        render();
      }).catch(() => { state._analyticsInsightsLoading = false; });
    }
    return h('div', { className: 'chart-card', style: { marginTop: '16px' } },
      h('h4', {}, 'Insights'),
      h('div', { style: { color: 'var(--gray-400)', fontSize: '13px', padding: '16px 0' } }, 'Loading insights...')
    );
  }

  const data = state.analyticsInsights;
  const severityColors = { warning: 'var(--amber)', info: 'var(--blue)', error: 'var(--red)' };
  const severityBg = { warning: '#fffbeb', info: '#eff6ff', error: '#fef2f2' };

  return h('div', { style: { marginTop: '16px' } },
    // Insights cards
    (data.insights && data.insights.length > 0) ? h('div', { className: 'chart-card' },
      h('h4', { style: { display: 'flex', alignItems: 'center', gap: '8px' } },
        'Actionable Insights',
        h('span', { style: { fontSize: '11px', padding: '2px 8px', background: 'var(--blue)', color: 'white', borderRadius: '10px' } }, String(data.insights.length))
      ),
      h('div', { style: { display: 'flex', flexDirection: 'column', gap: '8px', marginTop: '12px' } },
        ...data.insights.map(insight =>
          h('div', { style: { padding: '12px 16px', background: severityBg[insight.severity] || '#f8fafc', borderLeft: `3px solid ${severityColors[insight.severity] || 'var(--gray-300)'}`, borderRadius: '0 8px 8px 0' } },
            h('div', { style: { fontSize: '13px', fontWeight: '600', color: 'var(--gray-700)' } }, insight.title),
            insight.detail ? h('div', { style: { fontSize: '12px', color: 'var(--gray-500)', marginTop: '4px' } }, insight.detail) : null
          )
        )
      )
    ) : null,
    // Source reliability
    h('div', { className: 'analytics-grid', style: { marginTop: '16px' } },
      h('div', { className: 'chart-card' },
        h('h4', {}, 'Source Reliability Index'),
        data.source_reliability && Object.keys(data.source_reliability).length > 0
          ? h('div', { style: { display: 'flex', flexDirection: 'column', gap: '8px', marginTop: '8px' } },
              ...Object.entries(data.source_reliability)
                .sort((a, b) => b[1].factor - a[1].factor)
                .map(([src, info]) => {
                  const pct = info.approval_rate || 0;
                  const factorColor = info.factor >= 1.3 ? 'var(--green)' : info.factor >= 0.9 ? 'var(--blue)' : 'var(--amber)';

function buildDonutSVG(approved, review, rejected) {
  const total = approved + review + rejected || 1;
  const r = 54, cx = 70, cy = 70, sw = 12;
  const circumference = 2 * Math.PI * r;

  const segments = [
    { value: approved, color: '#059669' },
    { value: review, color: '#d97706' },
    { value: rejected, color: '#dc2626' }
  ];

  let offset = 0;
  const paths = segments.map(seg => {
    const pct = seg.value / total;
    const dashLen = circumference * pct;
    const dashOffset = -offset;
    offset += dashLen;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${sw}" stroke-dasharray="${dashLen} ${circumference - dashLen}" stroke-dashoffset="${dashOffset}" transform="rotate(-90 ${cx} ${cy})" />`;
  }).join('');

  return `<svg viewBox="0 0 140 140" width="140" height="140">${paths}<text x="${cx}" y="${cy - 6}" text-anchor="middle" font-family="Fraunces,serif" font-size="28" font-weight="700" fill="currentColor">${Math.round((approved/total)*100)}%</text><text x="${cx}" y="${cy + 14}" text-anchor="middle" font-size="11" fill="#94a3b8">approved</text></svg>`;
}

                )
              )
            ];
            if (isExpanded && trigger.raw_content) {
              rows.push(
                h('tr', {},
                  h('td', { colspan: '7', style: { padding: '16px 20px', background: 'var(--gray-50)', fontSize: '13px', lineHeight: '1.7', color: 'var(--gray-600)', whiteSpace: 'pre-wrap' } },
                    trigger.raw_content.slice(0, 1000),
                    trigger.raw_content.length > 1000 ? '...' : '',
                    trigger.url ? h('div', { style: { marginTop: '8px' } },
                      h('a', { href: trigger.url, target: '_blank', rel: 'noopener', style: { color: 'var(--blue)', fontSize: '12px' } }, 'View source')
                    ) : null
                  )
                )
              );
            }
            return rows;
          })
        )
      )
    )
  );
}

function renderCalendarPage() {
  const cal = state.monthCalendar;
  if (!cal) return h('div', { className: 'page-content' }, h('div', { className: 'spinner' }));

  const platformLabels = { linkedin: 'LI', x: 'X', video: 'Vid', blog: 'Blog', email: 'Email', youtube: 'YT' };
  const platformColors = {
    linkedin: 'platform-linkedin', x: 'platform-x', video: 'platform-video',
    blog: 'platform-blog', email: 'platform-email', youtube: 'platform-youtube'
  };

  // Pad start of month to align with day-of-week columns
  const firstDayOfWeek = cal.days[0]?.dayOfWeek || 0;
  const emptyBefore = [];
  for (let i = 0; i < firstDayOfWeek; i++) {
    emptyBefore.push(h('div', { className: 'cal-cell empty' }));
  }

  // Navigate months
  function prevMonth() {
    const [y, m] = state.calendarMonth.split('-').map(Number);
    const d = new Date(y, m - 2, 1);
    state.calendarMonth = d.toISOString().slice(0, 7);
    state.calendarSelectedDay = null;
    loadCalendarMonth();
  }
  function nextMonth() {
    const [y, m] = state.calendarMonth.split('-').map(Number);
    const d = new Date(y, m, 1);
    state.calendarMonth = d.toISOString().slice(0, 7);
    state.calendarSelectedDay = null;
    loadCalendarMonth();
  }

  // Get current week start for auto-fill
  function getCurrentWeekStart() {
    if (state.calendarSelectedDay) {
      const d = new Date(state.calendarSelectedDay);
      const dayOfWeek = d.getDay();
      d.setDate(d.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));
      return d.toISOString().split('T')[0];
    }
    const now = new Date();
    const dayOfWeek = now.getDay();
    now.setDate(now.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));
    return now.toISOString().split('T')[0];
  }

  // Count filled slots per day
  function filledCount(day) {
    return Object.values(day.slots).filter(Boolean).length;
  }

  return h('div', { className: 'page-content' },
    // Header: nav + stats
    h('div', { className: 'cal-header' },
      h('div', { className: 'cal-nav' },
        h('button', { className: 'cal-nav-btn', onclick: prevMonth }, '<'),
        h('span', { className: 'cal-month-label' }, `${cal.month_name} ${cal.year}`),
        h('button', { className: 'cal-nav-btn', onclick: nextMonth }, '>')
      ),
      h('div', { style: { display: 'flex', gap: '12px', alignItems: 'center' } },
        h('div', { className: 'coverage-bar', style: { width: '180px' } },
          h('span', { style: { fontSize: '12px', fontWeight: '600', color: 'var(--gray-500)', whiteSpace: 'nowrap' } },
            `${cal.stats.coverage}% filled`
          ),
          h('div', { className: 'coverage-track' },
            h('div', { className: 'coverage-fill', style: {
              width: `${cal.stats.coverage}%`,
              background: cal.stats.coverage > 60 ? 'var(--green)' : cal.stats.coverage > 30 ? 'var(--amber)' : 'var(--red)'
            }})
          )
        ),
        h('button', {
          className: 'btn btn-primary btn-sm',
          onclick: async () => {
            try {
              const weekStart = getCurrentWeekStart();
              toast('Auto-filling week...', 'info');
              const res = await api('/api/calendar/auto-fill', { method: 'POST', body: { week_start: weekStart } });
              toast(`Assigned ${res.assigned} content pieces!`, 'success');
              await loadCalendarMonth();
            } catch (err) { toast('Auto-fill failed: ' + err.message, 'error'); }
          }
        }, 'Fill Week'),
        h('button', {
          className: 'btn btn-outline btn-sm',
          onclick: () => {
            state.calendarMonth = new Date().toISOString().slice(0, 7);
            state.calendarSelectedDay = null;
            loadCalendarMonth();
          }
        }, 'Today')
      )
    ),

    // Week at a glance (current week)
    (() => {
      const today = new Date();
      const dayOfWeek = today.getDay();
      const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
      const weekDays = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(today);
        d.setDate(today.getDate() + mondayOffset + i);
        weekDays.push(d.toISOString().split('T')[0]);
      }
      const dayNames = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      const platforms = ['linkedin', 'x', 'video', 'blog', 'email', 'youtube'];
      return h('div', { className: 'card', style: { padding: '16px 20px', marginBottom: '20px' } },
        h('div', { style: { fontSize: '13px', fontWeight: '700', color: 'var(--navy)', marginBottom: '10px' } }, 'THIS WEEK AT A GLANCE'),
        h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: '8px' } },
          ...weekDays.map((date, i) => {
            const dayData = cal.days?.find(d => d.date === date);
            const isToday = date === today.toISOString().split('T')[0];
            const slots = dayData?.slots || {};
            const filledSlots = Object.entries(slots).filter(([, v]) => v);
            return h('div', { style: {
              padding: '10px', borderRadius: '10px', textAlign: 'center',
              border: isToday ? '2px solid var(--blue)' : '1px solid var(--gray-200)',
              background: isToday ? 'rgba(37,99,235,0.04)' : 'white',
              cursor: 'pointer'
            }, onclick: () => { state.calendarSelectedDay = date; render(); } },
              h('div', { style: { fontSize: '11px', fontWeight: '600', color: isToday ? 'var(--blue)' : 'var(--gray-500)' } }, dayNames[i]),
              h('div', { style: { fontSize: '16px', fontWeight: '700', color: 'var(--navy)', fontFamily: "'Fraunces', serif" } }, date.slice(8)),
              h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '2px', justifyContent: 'center', marginTop: '6px', minHeight: '20px' } },
                ...filledSlots.slice(0, 3).map(([slotKey]) => {
                  const platform = slotKey.split('_')[0];
                  const colors = { linkedin: '#0077B5', x: '#1DA1F2', video: '#EF4444', blog: '#10B981', email: '#8B5CF6', youtube: '#FF0000' };
                  return h('div', {
                    style: { width: '8px', height: '8px', borderRadius: '50%', background: colors[platform] || '#94a3b8' },
                    title: `${platformLabels[platform] || platform}: ${slots[slotKey]?.title || ''}`
                  });
                }),
                filledSlots.length === 0 ? h('div', { style: { fontSize: '9px', color: 'var(--gray-300)' } }, 'empty') : null
              )
            );
          })
        )
      );
    })(),

    // Month grid
    h('div', { className: 'cal-grid' },
      // Weekday headers
      ...['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d =>
        h('div', { className: 'cal-weekday' }, d)
      ),
      // Empty padding cells
      ...emptyBefore,
      // Day cells
      ...cal.days.map(day => {
        const filled = filledCount(day);
        const isSelected = state.calendarSelectedDay === day.date;
        return h('div', {
          className: `cal-cell ${day.isToday ? 'today' : ''} ${day.isPast ? 'past' : ''} ${isSelected ? 'today' : ''}`,
          style: isSelected ? { boxShadow: 'inset 0 0 0 2px var(--blue)' } : {},
          onclick: () => { state.calendarSelectedDay = day.date; render(); }
        },
          h('div', { className: 'cal-day-num' },
            String(day.dayNum),
            h('span', { className: 'cal-pillar-dot', style: { background: day.pillar_color } })
          ),
          // Show platform chips for filled slots
          ...Object.entries(day.slots)
            .filter(([, v]) => v)
            .slice(0, 4) // Max 4 chips visible
            .map(([slotKey, slot]) => {
              const platform = slotKey.split('_')[0];
              return h('div', {
                className: `cal-slot-chip ${platformColors[platform] || ''}`,
                title: slot.title || slotKey,
                onclick: (e) => {
                  e.stopPropagation();
                  if (slot.content_id) {
                    state.page = 'content';
                    render();
                  }
                }
              }, `${platformLabels[platform] || platform}: ${(slot.title || '').slice(0, 15)}`);
            }),
          // Show "+N more" if > 4 filled
          filled > 4
            ? h('div', { style: { fontSize: '9px', color: 'var(--gray-400)', textAlign: 'center' } }, `+${filled - 4} more`)
            : null,
          // Empty indicator
          filled === 0 && !day.isPast
            ? h('div', { style: { fontSize: '9px', color: 'var(--gray-300)', marginTop: '4px' } }, 'No content')
            : null
        );
      })
    ),

    // Day detail panel when a day is selected
    state.calendarSelectedDay ? renderCalendarDayDetail(cal) : null,

    // Weekly coverage breakdown
    cal.weeklyStats && cal.weeklyStats.length > 0
      ? h('div', { style: { marginTop: '24px' } },
          h('h4', { style: { fontSize: '14px', fontFamily: "'Fraunces', serif", marginBottom: '12px', color: 'var(--navy)' } }, 'Weekly Platform Coverage'),
          h('div', { style: { display: 'flex', flexDirection: 'column', gap: '8px' } },
            ...cal.weeklyStats.map((week, i) =>
              h('div', { style: { display: 'flex', alignItems: 'center', gap: '12px', background: 'var(--white)', padding: '10px 14px', borderRadius: 'var(--radius-sm)', border: '1px solid var(--gray-200)' } },
                h('span', { style: { fontSize: '12px', fontWeight: '600', color: 'var(--gray-500)', minWidth: '110px' } },
                  `Week ${i + 1}: ${week.start.slice(5)}`
                ),
                ...Object.entries(week.platformCoverage).map(([platform, data]) =>
                  h('div', { style: { display: 'flex', alignItems: 'center', gap: '4px' } },
                    h('span', { style: { fontSize: '10px', color: 'var(--gray-400)', width: '32px' } }, platformLabels[platform] || platform),
                    h('div', { style: { width: '40px', height: '6px', background: 'var(--gray-200)', borderRadius: '3px', overflow: 'hidden' } },
                      h('div', { style: {
                        width: `${data.pct}%`,
                        height: '100%',
                        background: data.pct > 50 ? 'var(--green)' : data.pct > 0 ? 'var(--amber)' : 'var(--gray-300)',
                        borderRadius: '3px'
                      }})
                    )
                  )
                )
              )
            )
          )
        )
      : null
  );
}

function renderCalendarAssignPicker(date, slotKey, platform) {
  // Map platform to matching content format keys
  const platformFormats = {
    linkedin: ['linkedin', 'carousel', 'poll'],
    x: ['x_single', 'x_thread'],
    video: ['short_video'],
    blog: ['blog'],
    email: ['newsletter'],
    youtube: ['youtube_script']
  };
  const matchingFormats = platformFormats[platform] || [platform];

  // Find approved content that has matching formats
  const candidates = (state.content || [])
    .filter(c => {
      const fmts = c.formats || {};
      return matchingFormats.some(f => fmts[f] && fmts[f].status === 'approved');
    })
    .slice(0, 8);

  return h('div', { style: { fontSize: '11px' } },
    candidates.length === 0
      ? h('div', { style: { color: 'var(--gray-400)', padding: '2px 0' } }, 'No approved content')
      : h('div', { style: { maxHeight: '120px', overflowY: 'auto' } },
          ...candidates.map(c => {
            const fmt = matchingFormats.find(f => c.formats[f]?.status === 'approved');
            return h('div', {
              style: { padding: '3px 6px', cursor: 'pointer', borderRadius: '4px', marginBottom: '2px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' },
              onclick: async (e) => {
                e.stopPropagation();
                try {
                  await api(`/api/calendar/${date}`, {
                    method: 'PUT',
                    body: { slot: slotKey, content_id: c.id, format: fmt, title: (c.trigger_title || '').slice(0, 80), status: 'approved' }
                  });
                  state._calAssignSlot = null;
                  toast('Content assigned!', 'success');
                  await loadCalendarMonth();
                } catch (err) { toast('Assign failed: ' + err.message, 'error'); }
              },
              onmouseover: (e) => { e.currentTarget.style.background = 'var(--gray-100)'; },
              onmouseout: (e) => { e.currentTarget.style.background = 'transparent'; }
            }, (c.trigger_title || 'Untitled').slice(0, 35));
          })
        ),
    h('button', {
      className: 'btn btn-ghost',
      style: { fontSize: '9px', padding: '1px 4px', color: 'var(--gray-400)', marginTop: '2px' },
      onclick: (e) => { e.stopPropagation(); state._calAssignSlot = null; render(); }
    }, 'Cancel')
  );
}

function renderCalendarDayDetail(cal) {
  const day = cal.days.find(d => d.date === state.calendarSelectedDay);
  if (!day) return null;

  const timeLabels = { morning: 'Morning (8-10am)', midday: 'Midday (12-2pm)', evening: 'Evening (5-7pm)' };
  const platformLabels = { linkedin: 'LinkedIn', x: 'X/Twitter', video: 'Video', blog: 'Blog', email: 'Email', youtube: 'YouTube' };

  // Find matching series template
  const dayNames = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
  const dayOfWeek = dayNames[new Date(day.date).getDay()];
  const series = (state.series || []).find(s => s.day === dayOfWeek && s.active !== false);

  return h('div', { className: 'cal-detail' },
    h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: series ? '8px' : '16px' } },
      h('h4', {},
        `${day.day}, ${day.date}`,
        h('span', {
          className: 'pillar-tag',
          style: { background: day.pillar_color + '15', color: day.pillar_color, marginLeft: '12px' }
        }, day.pillar_label)
      ),
      h('button', {
        className: 'btn btn-ghost btn-sm',
        onclick: () => { state.calendarSelectedDay = null; render(); }
      }, 'Close')
    ),
    series ? h('div', { style: { padding: '8px 12px', background: '#f0f9ff', border: '1px solid #bae6fd', borderRadius: '6px', marginBottom: '16px', fontSize: '12px', color: '#0369a1' } },
      h('strong', {}, series.name),
      h('span', { style: { marginLeft: '8px', color: '#64748b' } }, `Pillar: ${series.pillar} | Formats: ${series.formats.join(', ')}`)
    ) : null,
    h('div', { className: 'cal-detail-grid' },
      ...['morning', 'midday', 'evening'].map(time =>
        h('div', { className: 'cal-time-col' },
          h('h5', {}, timeLabels[time]),
          ...['linkedin', 'x', 'video', 'blog', 'email', 'youtube'].map(platform => {
            const slotKey = `${platform}_${time}`;
            const slot = day.slots[slotKey];
            return h('div', {
              className: `cal-platform-slot ${slot ? 'filled' : ''}`,
              onclick: async () => {
                if (slot?.content_id) {
                  state.page = 'content';
                  render();
                }
              }
            },
              h('div', { className: 'cal-platform-label' }, platformLabels[platform]),
              slot
                ? h('div', { style: { fontSize: '11px' } },
                    h('span', { style: { fontWeight: '500' } }, (slot.title || '').slice(0, 30)),
                    h('span', { style: { fontSize: '10px', color: 'var(--gray-400)', marginLeft: '4px' } },
                      slot.format || ''
                    ),
                    h('button', {
                      className: 'btn btn-ghost',
                      style: { fontSize: '10px', padding: '1px 4px', marginLeft: '4px', color: 'var(--red)' },
                      onclick: async (e) => {
                        e.stopPropagation();
                        try {
                          await api(`/api/calendar/${day.date}`, { method: 'PUT', body: { slot: slotKey, clear: true } });
                          toast('Slot cleared', 'success');
                          await loadCalendarMonth();
                        } catch (err) { toast('Failed: ' + err.message, 'error'); }
                      }
                    }, 'x')
                  )
                : state._calAssignSlot === `${day.date}:${slotKey}`
                  ? renderCalendarAssignPicker(day.date, slotKey, platform)
                  : h('div', { style: { display: 'flex', gap: '8px', padding: '2px 0' } },
                      h('span', {
                        style: { fontSize: '11px', color: 'var(--blue)', cursor: 'pointer' },
                        onclick: (e) => {
                          e.stopPropagation();
                          state._calAssignSlot = `${day.date}:${slotKey}`;
                          render();
                        }
                      }, '+ Assign'),
                      h('span', {
                        style: { fontSize: '11px', color: 'var(--green)', cursor: state._calGenerating === `${day.date}:${slotKey}` ? 'wait' : 'pointer' },
                        onclick: async (e) => {
                          e.stopPropagation();
                          const key = `${day.date}:${slotKey}`;
                          if (state._calGenerating === key) return;
                          state._calGenerating = key;
                          render();
                          try {
                            toast('Generating content for this slot...', 'info');
                            const res = await api('/api/calendar/generate', { method: 'POST', body: { date: day.date, slot: slotKey } });
                            toast(`Generated: ${(res.trigger_title || '').slice(0, 50)}`, 'success');
                            await Promise.all([loadData(), loadCalendarMonth()]);
                          } catch (err) { toast('Generate failed: ' + err.message, 'error'); }
                          state._calGenerating = null;
                          render();
                        }
                      }, state._calGenerating === `${day.date}:${slotKey}` ? 'Generating...' : '+ Generate')
                    )
            );
          })
        )
      )
    )
  );
}

async function loadCalendarMonth() {
  try {
    const monthCal = await api(`/api/calendar?month=${state.calendarMonth}`);
    state.monthCalendar = monthCal;
    render();
  } catch (err) { toast('Failed to load calendar: ' + err.message, 'error'); }
}

function renderSeriesPage() {
  const series = state.series || [];

  const dayColors = { monday: '#dc2626', tuesday: '#2563eb', wednesday: '#059669', thursday: '#d97706', friday: '#7c3aed', saturday: '#0ea5e9', sunday: '#ec4899' };

  return h('div', {},
    h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px' } },
      h('div', {},
        h('h2', { style: { fontFamily: "'Fraunces', serif", fontSize: '24px' } }, 'Content Series'),
        h('p', { style: { color: 'var(--gray-500)', fontSize: '14px' } }, `${series.filter(s => s.active).length} active series, ${series.reduce((s, x) => s + (x.episodes || []).length, 0)} episodes generated`)
      ),
      h('div', { style: { display: 'flex', gap: '8px' } },
        h('button', {
          className: 'btn btn-primary btn-sm',
          disabled: state.leadMagnetGenerating,
          onclick: async () => {
            state.leadMagnetGenerating = true; render();
            try {
              const res = await api('/api/lead-magnets/generate', { method: 'POST', body: { count: 3 } });
              if (res.batch_id) {
                const poll = setInterval(async () => {
                  const prog = await api(`/api/generate-batch/${res.batch_id}`);
                  if (prog.status === 'done' || prog.status === 'error') {
                    clearInterval(poll);
                    state.leadMagnetGenerating = false;
                    toast(`Generated ${prog.completed} lead magnets`, prog.status === 'done' ? 'success' : 'error');
                    loadData();
                  }
                }, 5000);
              }
            } catch (err) { state.leadMagnetGenerating = false; toast(err.message, 'error'); render(); }
          }

    h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: '8px', marginBottom: '24px' } },

          h('div', { style: { fontSize: '11px', fontWeight: '700', textTransform: 'uppercase', color: dayColors[day] || 'var(--gray-500)', marginBottom: '8px' } }, day),
          ...daySeries.map(s => h('div', { style: { fontSize: '12px', padding: '4px 8px', borderRadius: '6px', background: `${dayColors[day]}15`, color: dayColors[day], fontWeight: '600', marginBottom: '4px' } }, s.name))

function renderPublishTrackerPage() {

  const totalPublished = items.filter(i => Object.values(i.publish_status || {}).some(p => p.published)).length;

  }

  return h('div', {},
    h('h2', { style: { fontFamily: "'Fraunces', serif", fontSize: '24px', marginBottom: '4px' } }, 'Publish Tracker'),

    // Platform stats bar
    h('div', { style: { display: 'grid', gridTemplateColumns: `repeat(${platforms.length}, 1fr)`, gap: '8px', marginBottom: '24px' } },
      ...platforms.map(p =>
        h('div', { style: { background: 'white', borderRadius: 'var(--radius-sm)', padding: '12px', border: '1px solid var(--gray-200)', textAlign: 'center' } },
          h('div', { style: { fontSize: '22px', fontWeight: '700', fontFamily: "'Fraunces', serif", color: platformColors[p] || 'var(--gray-700)' } }, String(byPlatform[p] || 0)),
          h('div', { style: { fontSize: '11px', fontWeight: '600', textTransform: 'uppercase', color: 'var(--gray-500)' } }, p)
        )
      )
    ),
    // Content publish matrix
    items.length === 0
      ? h('div', { style: { textAlign: 'center', padding: '40px', color: 'var(--gray-400)' } }, 'No approved content yet. Approve content to start tracking.')
      : h('div', { style: { background: 'white', borderRadius: 'var(--radius)', border: '1px solid var(--gray-200)', overflow: 'hidden' } },
          // Header row
          h('div', { style: { display: 'grid', gridTemplateColumns: `2fr repeat(${platforms.length}, 1fr)`, padding: '10px 16px', borderBottom: '2px solid var(--gray-200)', background: 'var(--gray-50)' } },
            h('div', { style: { fontSize: '12px', fontWeight: '700', color: 'var(--gray-500)' } }, 'CONTENT'),
            ...platforms.map(p => h('div', { style: { fontSize: '11px', fontWeight: '700', color: platformColors[p], textAlign: 'center', textTransform: 'uppercase' } }, p))
          ),
          // Content rows
          ...items.slice(0, 50).map(item =>
            h('div', { style: { display: 'grid', gridTemplateColumns: `2fr repeat(${platforms.length}, 1fr)`, padding: '10px 16px', borderBottom: '1px solid var(--gray-100)', alignItems: 'center' } },
              h('div', {},
                h('div', { style: { fontSize: '13px', fontWeight: '500' } }, item.title?.slice(0, 60) || 'Untitled'),
                h('div', { style: { fontSize: '11px', color: 'var(--gray-400)', display: 'flex', gap: '6px' } },
                  ...item.formats.slice(0, 3).map(f => h('span', {}, f)),
                  item.series_id ? h('span', { style: { color: 'var(--blue)' } }, item.series_id) : null
                )
              ),
              ...platforms.map(p => {
                const status = item.publish_status?.[p];
                if (status?.published) {
                  return h('div', { style: { textAlign: 'center' } },
                    status.url
                      ? h('a', { href: status.url, target: '_blank', style: { color: platformColors[p], fontSize: '16px', textDecoration: 'none' } }, '\u2713')
                      : h('span', { style: { color: platformColors[p], fontSize: '16px' } }, '\u2713')
                  );
                }
                // Show publish button for formats matching this platform
                const platformFormats = { linkedin: ['linkedin', 'carousel', 'poll'], x: ['x_single', 'x_thread'], youtube: ['short_video', 'youtube_script'], blog: ['blog'], newsletter: ['newsletter'], instagram: ['carousel', 'quote_cards', 'stat_graphic'] };
                const matchingFormats = (platformFormats[p] || []).filter(f => item.formats.includes(f));
                if (matchingFormats.length === 0) return h('div', { style: { textAlign: 'center', color: 'var(--gray-300)' } }, '\u2014');
                return h('div', { style: { textAlign: 'center' } },
                  h('button', {
                    style: { width: '24px', height: '24px', borderRadius: '50%', border: `2px solid ${platformColors[p]}40`, background: 'white', cursor: 'pointer', fontSize: '10px', color: platformColors[p], display: 'inline-flex', alignItems: 'center', justifyContent: 'center' },
                    onclick: async () => {
                      const url = prompt(`Enter the published URL for ${p} (optional):`);
                      try {
                        await api(`/api/content/${item.content_id}/track-publish`, {
                          method: 'POST',
                          body: { format: matchingFormats[0], platform: p, url: url || null }
                        });
                        toast(`Tracked publish on ${p}`, 'success');
                        loadData();
                      } catch (err) { toast(err.message, 'error'); }
                    },
                    title: `Mark as published on ${p}`
                  }, '+')
                );
              })
            )
          )
        )
  );
}

function renderMeetingsPage() {
  const ms = state.meetingStats || {};
  const meetings = state.meetings || [];
  const detail = state.meetingDetail;

  // Filter meetings
  let filtered = [...meetings];
  if (state.meetingFilter.type) {
    filtered = filtered.filter(m => m.meeting_type === state.meetingFilter.type);
  }
  if (state.meetingFilter.client) {
    const q = state.meetingFilter.client.toLowerCase();
    filtered = filtered.filter(m =>
      (m.client_name || '').toLowerCase().includes(q) ||
      (m.client_email || '').toLowerCase().includes(q) ||
      (m.title || '').toLowerCase().includes(q)
    );
  }

  const typeBadge = (type) => {
    const colors = {
      discovery: 'var(--blue)', demo: 'var(--blue-light)', onboarding: 'var(--green)', review: 'var(--amber)',
      strategy: 'var(--purple)', internal: 'var(--gray-500)', unknown: 'var(--gray-400)'
    };
    return h('span', { style: {
      background: colors[type] || 'var(--gray-400)', color: 'white',
      padding: '2px 8px', borderRadius: '12px', fontSize: '11px', fontWeight: '600'
    } }, type || 'unknown');
  };

  const sentimentIcon = (s) => {
    const map = { positive: '+', negative: '-', mixed: '~', neutral: '=' };
    const colors = { positive: 'var(--green)', negative: 'var(--red)', mixed: 'var(--amber)', neutral: 'var(--gray-400)' };
    return h('span', { style: { color: colors[s] || 'var(--gray-400)', fontWeight: '700', fontSize: '14px' } }, map[s] || '?');
  };

  // Detail view
  if (detail) {
    const ed = detail.extracted_data || {};
    const cn = detail.coaching_notes;
    return h('div', { className: 'page-content' },
      h('div', { style: { display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '20px' } },
        h('button', {
          className: 'btn btn-ghost btn-sm',
          onclick: () => { state.meetingDetail = null; render(); }
        }, 'Back'),
        h('h3', { style: { fontFamily: "'Fraunces', serif" } }, detail.title),
        typeBadge(detail.meeting_type),
        sentimentIcon(detail.sentiment),
        h('div', { style: { marginLeft: 'auto' } },
          h('button', {
            className: 'btn btn-primary btn-sm',
            disabled: state._extractingTriggers,
            onclick: async () => {
              state._extractingTriggers = true; render();
              try {
                const result = await api(`/api/meetings/${detail.id}/extract-triggers`, { method: 'POST' });
                toast(`Extracted ${result.added || 0} content triggers from meeting`, 'success');
                loadData();
              } catch (err) {
                toast('Failed to extract triggers: ' + err.message, 'error');
              }
              state._extractingTriggers = false; render();
            }
          }, state._extractingTriggers ? 'Extracting...' : 'Extract Content Triggers')
        )

function feedbackWidget(outputId, outputType) {
  const existing = (state._feedbackCache || {})[`${outputType}:${outputId}`];
  return h('div', { style: { display: 'inline-flex', gap: '4px', alignItems: 'center' } },
    h('button', {
      className: 'btn btn-ghost btn-sm',
      style: { padding: '4px 8px', fontSize: '16px', color: existing === 5 ? 'var(--green)' : 'var(--gray-400)' },
      onclick: async (e) => {
        e.stopPropagation();
        try {
          await api('/api/feedback', { method: 'POST', body: { output_id: String(outputId), output_type: outputType, rating: 5, comment: 'Helpful' } });
          if (!state._feedbackCache) state._feedbackCache = {};
          state._feedbackCache[`${outputType}:${outputId}`] = 5;
          toast('Thanks for the feedback!', 'success'); render();
        } catch (err) { toast(err.message, 'error'); }
      }
    }, '\u{1F44D}'),
    h('button', {
      className: 'btn btn-ghost btn-sm',
      style: { padding: '4px 8px', fontSize: '16px', color: existing === 1 ? 'var(--red)' : 'var(--gray-400)' },
      onclick: async (e) => {
        e.stopPropagation();
        try {
          await api('/api/feedback', { method: 'POST', body: { output_id: String(outputId), output_type: outputType, rating: 1, comment: 'Not helpful' } });
          if (!state._feedbackCache) state._feedbackCache = {};
          state._feedbackCache[`${outputType}:${outputId}`] = 1;
          toast('Feedback recorded', 'info'); render();
        } catch (err) { toast(err.message, 'error'); }
      }
    }, '\u{1F44E}')
  );
}

function meetingStatCard(label, value) {
  return h('div', { className: 'card', style: { textAlign: 'center', padding: '16px' } },
    h('div', { style: { fontSize: '24px', fontWeight: '700', color: 'var(--navy)', fontFamily: "'Fraunces', serif" } }, String(value)),
    h('div', { style: { fontSize: '12px', color: 'var(--gray-500)', marginTop: '4px' } }, label)
  );
}

function renderChatPage() {
  const messages = state.chatMessages || [];

  async function sendMessage() {
    const text = (state.chatInput || '').trim();
    if (!text || state.chatLoading) return;

    state.chatMessages.push({ role: 'user', content: text, created_at: new Date().toISOString() });
    state.chatInput = '';
    state.chatLoading = true;
    render();

    // Scroll to bottom
    setTimeout(() => {
      const container = document.querySelector('.chat-messages');
      if (container) container.scrollTop = container.scrollHeight;
    }, 50);

    try {
      const res = await api('/api/chat', { method: 'POST', body: { message: text } });
      state.chatMessages.push({ role: 'assistant', content: res.response, created_at: new Date().toISOString() });
    } catch (err) {
      state.chatMessages.push({ role: 'assistant', content: `Error: ${err.message}`, created_at: new Date().toISOString() });
    }
    state.chatLoading = false;
    render();

    setTimeout(() => {
      const container = document.querySelector('.chat-messages');
      if (container) container.scrollTop = container.scrollHeight;
    }, 50);
  }

  return h('div', { className: 'page-content', style: { display: 'flex', flexDirection: 'column', height: 'calc(100vh - 72px)', padding: '0' } },
    // Messages area
    h('div', { className: 'chat-messages', style: {
      flex: 1, overflowY: 'auto', padding: '24px',
      display: 'flex', flexDirection: 'column', gap: '16px'
    } },
      messages.length === 0
        ? h('div', { style: { textAlign: 'center', marginTop: '80px', color: 'var(--gray-400)' } },
            h('div', { innerHTML: icons.chat, style: { width: '64px', height: '64px', margin: '0 auto 16px', opacity: '0.3' } }),
            h('h3', { style: { fontFamily: "'Fraunces', serif", marginBottom: '8px', color: 'var(--gray-500)' } }, 'Ask the Brain anything'),
            h('p', { style: { fontSize: '14px', maxWidth: '400px', margin: '0 auto', lineHeight: '1.6' } },
              'Try: "What should Yaseer do today?" or "What happened on the call with Zain?" or "What patterns are we seeing?"')
          )
        : messages.map(m =>
            h('div', { style: {
              display: 'flex', justifyContent: m.role === 'user' ? 'flex-end' : 'flex-start',
              maxWidth: '100%'
            } },
              h('div', { style: {
                maxWidth: '75%', padding: '12px 16px', borderRadius: '12px',
                background: m.role === 'user' ? 'var(--blue)' : 'var(--gray-100)',
                color: m.role === 'user' ? 'white' : 'var(--gray-800)',
                fontSize: '14px', lineHeight: '1.6', whiteSpace: 'pre-wrap'
              } }, m.content)
            )
          ),
      state.chatLoading
        ? h('div', { style: { display: 'flex', justifyContent: 'flex-start' } },
            h('div', { style: {
              padding: '12px 16px', borderRadius: '12px', background: 'var(--gray-100)',
              fontSize: '14px', color: 'var(--gray-400)'
            } }, 'Thinking...')
          )
        : null
    ),
    // Input area
    h('div', { style: {
      padding: '16px 24px', borderTop: '1px solid var(--gray-200)',
      display: 'flex', gap: '12px', background: 'white'
    } },
      h('input', {
        type: 'text',
        placeholder: 'Ask the brain...',
        value: state.chatInput || '',
        oninput: (e) => { state.chatInput = e.target.value; },
        onkeydown: (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } },
        style: {
          flex: 1, padding: '12px 16px', borderRadius: '12px',
          border: '1px solid var(--gray-200)', fontSize: '14px',
          fontFamily: "'Outfit', sans-serif", outline: 'none'
        },
        autofocus: true
      }),
      h('button', {
        className: 'btn btn-primary',
        disabled: state.chatLoading || !(state.chatInput || '').trim(),
        onclick: sendMessage,
        style: { borderRadius: '12px', padding: '12px 24px' }
      }, state.chatLoading ? 'Thinking...' : 'Send')
    )
  );
}

function renderClientsPage() {
  const clients = state.clients || [];
  const detail = state.clientDetail;
  const q = (state.clientSearch || '').toLowerCase();
  const filtered = q ? clients.filter(c =>
    (c.name || '').toLowerCase().includes(q) ||
    (c.email || '').toLowerCase().includes(q) ||
    (c.firm_name || '').toLowerCase().includes(q)
  ) : clients;

  const health = state.healthData || { summary: {}, clients: [] };
  const healthMap = {};
  for (const h of (health.clients || [])) { healthMap[h.client_id] = h; }

  const statusBadge = (status) => {
    const colors = { prospect: 'var(--blue)', active: 'var(--green)', churned: 'var(--red)', lost: 'var(--gray-500)' };
    return h('span', { style: {
      background: colors[status] || 'var(--gray-400)', color: 'white',
      padding: '2px 8px', borderRadius: '12px', fontSize: '11px', fontWeight: '600'
    } }, status || 'prospect');
  };

  const healthDot = (clientId) => {
    const ch = healthMap[clientId];
    if (!ch) return null;

function renderActionsPage() {
  const actions = state.allActions || [];
  const filter = state.actionsFilter || {};

  let filtered = [...actions];
  if (filter.status) filtered = filtered.filter(a => a.status === filter.status);
  if (filter.owner) filtered = filtered.filter(a => a.owner === filter.owner);

  const owners = [...new Set(actions.map(a => a.owner).filter(Boolean))];
  const openCount = actions.filter(a => a.status === 'open').length;
  const doneCount = actions.filter(a => a.status === 'done').length;
  const usActions = actions.filter(a => a.owner === 'us' && a.status === 'open').length;
  const clientActions = actions.filter(a => a.owner === 'client' && a.status === 'open').length;

  const ownerColor = (owner) => {
    const map = { us: 'var(--blue)', client: 'var(--amber)', Fardeen: 'var(--purple)', Yaseer: 'var(--green)', Monty: 'var(--red)', Juhi: '#ec4899' };
    return map[owner] || 'var(--gray-500)';
  };

  return h('div', { className: 'page-content' },
    // Stats
    h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '16px', marginBottom: '20px' } },
      meetingStatCard('Total', actions.length),
      meetingStatCard('Open', openCount),
      meetingStatCard('Our Actions', usActions),
      meetingStatCard('Client Actions', clientActions)
    ),
    // Filters
    h('div', { style: { display: 'flex', gap: '12px', marginBottom: '20px', alignItems: 'center' } },
      h('select', {
        style: { padding: '6px 10px', borderRadius: 'var(--radius-sm)', border: '1px solid var(--gray-200)', fontSize: '13px' },
        value: filter.status || '',
        onchange: (e) => { state.actionsFilter.status = e.target.value; render(); }
      },
        h('option', { value: '' }, 'All Status'),
        h('option', { value: 'open' }, `Open (${openCount})`),
        h('option', { value: 'done' }, `Done (${doneCount})`)
      ),
      h('select', {
        style: { padding: '6px 10px', borderRadius: 'var(--radius-sm)', border: '1px solid var(--gray-200)', fontSize: '13px' },
        value: filter.owner || '',
        onchange: (e) => { state.actionsFilter.owner = e.target.value; render(); }
      },
        h('option', { value: '' }, 'All Owners'),
        ...owners.map(o => h('option', { value: o }, o))
      ),
      h('span', { style: { marginLeft: 'auto', fontSize: '12px', color: 'var(--gray-400)' } },
        `${filtered.length} action${filtered.length !== 1 ? 's' : ''}`)
    ),
    // Actions list
    filtered.length === 0
      ? h('div', { className: 'card', style: { textAlign: 'center', padding: '40px', color: 'var(--gray-400)' } },
          h('div', { innerHTML: icons.actions, style: { width: '48px', height: '48px', margin: '0 auto 12px', opacity: '0.3' } }),
          h('p', {}, 'No action items'),
          h('p', { style: { fontSize: '13px', marginTop: '8px' } }, 'Actions are extracted from meeting transcripts')
        )
      : h('div', { style: { display: 'flex', flexDirection: 'column', gap: '6px' } },
          ...filtered.map(a =>
            h('div', {
              className: 'card',
              style: { padding: '10px 16px', display: 'flex', alignItems: 'center', gap: '12px',
                opacity: a.status === 'done' ? '0.6' : '1' }
            },
              h('input', {
                type: 'checkbox',
                checked: a.status === 'done',
                style: { width: '18px', height: '18px', cursor: 'pointer', accentColor: 'var(--green)' },
                onchange: async () => {
                  try {
                    await api(`/api/actions/${a.id}`, {
                      method: 'PUT',
                      body: { status: a.status === 'done' ? 'open' : 'done' }
                    });
                    await loadData();
                  } catch (err) { toast('Update failed: ' + err.message, 'error'); }
                }
              }),
              h('div', { style: { flex: 1 } },
                h('div', { style: {
                  fontSize: '13px', fontWeight: '500',
                  textDecoration: a.status === 'done' ? 'line-through' : 'none',
                  color: a.status === 'done' ? 'var(--gray-400)' : 'inherit'
                } }, a.description),
                h('div', { style: { display: 'flex', gap: '12px', fontSize: '11px', color: 'var(--gray-400)', marginTop: '2px' } },
                  a.meeting_id ? h('span', {
                    style: { cursor: 'pointer', textDecoration: 'underline' },
                    onclick: async (e) => {
                      e.stopPropagation();
                      try {
                        const [meeting, mActions, atoms] = await Promise.all([
                          api(`/api/meetings/${a.meeting_id}`), api(`/api/meetings/${a.meeting_id}/actions`), api(`/api/meetings/${a.meeting_id}/atoms`)
                        ]);
                        state.meetingDetail = { ...meeting, _actions: mActions, _atoms: atoms };
                        state.page = 'meetings';
                        render();
                      } catch (err) { toast('Failed to load meeting', 'error'); }
                    }
                  }, `Meeting #${a.meeting_id}`) : null,
                  a.due_date ? h('span', {}, `Due: ${a.due_date}`) : null,
                  a.created_at ? h('span', {}, new Date(a.created_at).toLocaleDateString()) : null
                )
              ),
              a.owner ? h('span', { style: {
                background: ownerColor(a.owner) + '18', color: ownerColor(a.owner),
                padding: '2px 10px', borderRadius: '12px', fontSize: '11px', fontWeight: '600',
                whiteSpace: 'nowrap'
              } }, a.owner) : null
            )
          )
        )
  );
}

// --- Pipeline Page ---

  const health = state.healthData || { summary: {}, clients: [] };
  const clients = health.clients || [];
  const filter = state.pipelineFilter;
  const filtered = filter === 'all' ? clients : clients.filter(c => c.health_status === filter);

  const green = clients.filter(c => c.health_status === 'green').length;
  const yellow = clients.filter(c => c.health_status === 'yellow').length;
  const red = clients.filter(c => c.health_status === 'red').length;

  const proposals = (state.meetings || []).filter(m => m.meeting_type === 'discovery').length;
  const stale = clients.filter(c => c.days_since_contact >= 5).length;

  return h('div', { className: 'page-content' },
    // Stats
    h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: '16px', marginBottom: '20px' } },
      meetingStatCard('Total', clients.length),
      h('div', { className: 'card', style: { textAlign: 'center', padding: '16px', cursor: 'pointer', background: filter === 'green' ? 'var(--green-light)' : '' }, onclick: () => { state.pipelineFilter = filter === 'green' ? 'all' : 'green'; render(); } },
        h('div', { style: { fontSize: '24px', fontWeight: '700', color: 'var(--green)', fontFamily: "'Fraunces', serif" } }, String(green)),
